name: Reconcile workspace lockfile

on:
  push:
    branches:
      - refactor/modular-workspaces-foundation
    paths:
      - ".github/workflows/reconcile-workspace-lockfile.yml"
      - "apps/web/package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'AnnWann/dnd-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate npm workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify all workspace links
        run: npm run check:workspace-boundaries
      - name: Commit reconciled lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: reconcile npm workspace lockfile"
          git push origin HEAD:refactor/modular-workspaces-foundation
