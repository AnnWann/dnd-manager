name: Patch optimistic custom resource UI

on:
  push:
    branches:
      - qa
    paths:
      - .github/workflows/patch-custom-resource-optimistic-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Apply optimistic resource patch
        run: python .github/patch_custom_resource_optimistic.py

      - name: Remove temporary patch files
        run: rm .github/patch_custom_resource_optimistic.py .github/workflows/patch-custom-resource-optimistic-ui.yml

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Build
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render custom resource changes optimistically"
          git push origin HEAD:qa
