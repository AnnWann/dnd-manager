name: Apply general hand actions

on:
  pull_request:
    paths:
      - ".github/versatile-attack-card-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply general hand actions and unarmed attacks
        run: python .github/apply-versatile-attack-card-toggle.py

      - name: Fix generated dialog callback narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/characters/characterSheet/weaponAttackCardActionsDialog.tsx')
          text = path.read_text()
          pattern = re.compile(
              r'  const occupant = findHandOccupantByItemId\(character, state\.itemId\)\n'
              r'  if \(!occupant\) return null'
          )
          replacement = (
              '  const itemId: string = state.itemId\n'
              '  const resolvedOccupant = findHandOccupantByItemId(character, itemId)\n'
              '  if (!resolvedOccupant) return null\n'
              '  const occupant: HandOccupant = resolvedOccupant'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'dialog narrowing matched {count} times')
          text = text.replace('state.itemId', 'itemId')
          text = text.replace(
              'const itemId: string = itemId',
              'const itemId: string = state.itemId',
              1,
          )
          path.write_text(text)
          PY

      - name: Remove temporary implementation files
        run: rm -f .github/versatile-attack-card-trigger .github/apply-versatile-attack-card-toggle.py

      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run build

      - name: Commit implementation to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add general hand actions and unarmed attacks"
          git push origin HEAD:${{ github.head_ref }}
