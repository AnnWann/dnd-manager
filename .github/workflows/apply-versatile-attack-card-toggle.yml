name: Apply versatile attack card toggle

on:
  pull_request:
    paths:
      - ".github/versatile-attack-card-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct compact card patch anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply-versatile-attack-card-toggle.py')
          text = path.read_text()
          old = "'''                       damageBonus={damageBonus}\n                      />''',"
          new = "'''                       damageBonus={damageBonus}\n                     />''',"
          if old not in text:
              raise SystemExit('compact card anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply versatile attack card toggle
        run: python .github/apply-versatile-attack-card-toggle.py

      - name: Remove temporary implementation files
        run: rm -f .github/versatile-attack-card-trigger .github/apply-versatile-attack-card-toggle.py

      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run build

      - name: Commit implementation to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "toggle versatile weapons from attack cards"
          git push origin HEAD:${{ github.head_ref }}
