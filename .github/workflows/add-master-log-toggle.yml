name: Add master log visibility toggle

on:
  push:
    branches:
      - qa
    paths:
      - ".github/workflows/add-master-log-toggle.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout qa
        uses: actions/checkout@v4
        with:
          ref: qa

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Add master log toggle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/features/session/SessionActionLog.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise RuntimeError(f"Expected snippet not found: {old[:180]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { History, Undo2 } from "lucide-react"\n',
              'import { History, PanelRightClose, PanelRightOpen, Undo2 } from "lucide-react"\n',
          )

          replace_once(
              'const REST_LEGACY_MATCH_WINDOW_MS = 3_000\nconst LOG_PAGE_SIZE = 20\n',
              'const REST_LEGACY_MATCH_WINDOW_MS = 3_000\nconst LOG_PAGE_SIZE = 20\nconst MASTER_LOG_COLLAPSED_STORAGE_KEY = "dnd-manager:session-action-log:collapsed"\n',
          )

          replace_once(
              '  const customSystemDefinitions = runtime?.runtimeConfigSnapshot?.config.customSystems ?? []\n  const [page, setPage] = useState(0)\n',
              '''  const customSystemDefinitions = runtime?.runtimeConfigSnapshot?.config.customSystems ?? []\n  const [page, setPage] = useState(0)\n  const [collapsedForMaster, setCollapsedForMaster] = useState(() => {\n    if (typeof window === "undefined") return false\n    return window.localStorage.getItem(MASTER_LOG_COLLAPSED_STORAGE_KEY) === "1"\n  })\n  const canToggleVisibility = runtime?.role === "MASTER"\n''',
          )

          replace_once(
              '''  useEffect(() => {\n    if (page < pageCount) return\n    setPage(Math.max(0, pageCount - 1))\n  }, [page, pageCount])\n\n  return (\n''',
              '''  useEffect(() => {\n    if (page < pageCount) return\n    setPage(Math.max(0, pageCount - 1))\n  }, [page, pageCount])\n\n  useEffect(() => {\n    if (!canToggleVisibility || typeof window === "undefined") return\n    window.localStorage.setItem(\n      MASTER_LOG_COLLAPSED_STORAGE_KEY,\n      collapsedForMaster ? "1" : "0",\n    )\n  }, [canToggleVisibility, collapsedForMaster])\n\n  if (canToggleVisibility && collapsedForMaster) {\n    return (\n      <aside className="hidden w-14 shrink-0 flex-col items-center border-l border-border bg-bg-elevated xl:flex">\n        <div className="flex h-16 w-full shrink-0 items-center justify-center border-b border-border">\n          <button\n            type="button"\n            onClick={() => setCollapsedForMaster(false)}\n            className="grid h-9 w-9 place-items-center rounded-lg border border-border bg-bg-subtle text-textMuted transition-colors hover:border-accentBorder hover:bg-accentBg hover:text-textH"\n            title="Mostrar logs da sessão"\n            aria-label="Mostrar logs da sessão"\n          >\n            <PanelRightOpen className="h-4 w-4" />\n          </button>\n        </div>\n      </aside>\n    )\n  }\n\n  return (\n''',
          )

          replace_once(
              '''        <div className="min-w-0">\n          <div className="text-sm font-semibold text-textH">Logs da sessão</div>\n          <div className="text-xs text-textMuted">{records.length} ações recentes</div>\n        </div>\n      </header>\n''',
              '''        <div className="min-w-0 flex-1">\n          <div className="text-sm font-semibold text-textH">Logs da sessão</div>\n          <div className="text-xs text-textMuted">{records.length} ações recentes</div>\n        </div>\n        {canToggleVisibility ? (\n          <button\n            type="button"\n            onClick={() => setCollapsedForMaster(true)}\n            className="grid h-9 w-9 shrink-0 place-items-center rounded-lg text-textMuted transition-colors hover:bg-bg-subtle hover:text-textH"\n            title="Ocultar logs da sessão"\n            aria-label="Ocultar logs da sessão"\n          >\n            <PanelRightClose className="h-4 w-4" />\n          </button>\n        ) : null}\n      </header>\n''',
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check shared Select boundary
        run: npm run check:native-selects

      - name: Typecheck frontend
        run: npx tsc -b --pretty false

      - name: Build frontend
        run: npx vite build

      - name: Commit change and remove staging workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/session/SessionActionLog.tsx
          git rm .github/workflows/add-master-log-toggle.yml
          git commit -m "feat: let masters collapse session logs"
          git push origin HEAD:qa
