name: Validate modular refactor

on:
  pull_request:
    paths:
      - "src/**"
      - "session-server/**"
      - "packages/**"
      - "api/**"
      - "api-handlers/**"
      - "server/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/validate-modular-refactor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install website dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build website
        run: npm run build
      - name: Install session server dependencies
        run: npm ci --prefix session-server --ignore-scripts --no-audit --no-fund
      - name: Typecheck session server
        run: npm run typecheck:session-server
