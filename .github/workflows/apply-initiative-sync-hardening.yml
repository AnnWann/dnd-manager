name: Apply initiative sync hardening

on:
  push:
    branches:
      - agent/initiative-sync-bulk-actions
    paths:
      - .github/workflows/apply-initiative-sync-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initiative-sync-bulk-actions
          fetch-depth: 0

      - name: Apply hardening patch
        run: python .github/patch_initiative_sync_hardening.py

      - name: Remove temporary patch files
        run: rm .github/patch_initiative_sync_hardening.py .github/workflows/apply-initiative-sync-hardening.yml

      - name: Install frontend dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Build frontend
        run: npm run build

      - name: Install session server dependencies
        run: npm --prefix session-server install --package-lock=false --ignore-scripts

      - name: Typecheck session server
        run: npm run typecheck:session-server

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden initiative custom actions"
          git pull --rebase origin agent/initiative-sync-bulk-actions
          git push origin HEAD:agent/initiative-sync-bulk-actions
