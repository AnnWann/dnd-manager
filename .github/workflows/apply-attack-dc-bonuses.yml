name: Apply attack and DC bonuses

on:
  pull_request:
    paths:
      - ".github/attack-dc-bonus-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply attack and DC bonus support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"{label} not found")
              return text.replace(old, new, 1)

          bonus_path = Path("src/models/bonuses/Bonus.ts")
          bonus = bonus_path.read_text()
          bonus = replace_once(
              bonus,
              '  attackBonus?: Bonus[]\n  damageBonus?: Bonus[]\n',
              '  attackBonus?: Bonus[]\n  saveDcBonus?: Bonus[]\n  damageBonus?: Bonus[]\n',
              'bonus collection attack target',
          )
          bonus = replace_once(
              bonus,
              '  | "attackBonus"\n  | "damageBonus"\n',
              '  | "attackBonus"\n  | "saveDcBonus"\n  | "damageBonus"\n',
              'normal bonus key attack target',
          )
          bonus_path.write_text(bonus)

          format_path = Path("src/lib/formatBonus.ts")
          formatted = format_path.read_text()
          formatted = replace_once(
              formatted,
              '    case "attackBonus":\n      return "Ataque"\n    case "speed":\n',
              '    case "attackBonus":\n      return "Ataque"\n    case "saveDcBonus":\n      return "CD"\n    case "speed":\n',
              'formatted DC bonus label',
          )
          format_path.write_text(formatted)

          fields_path = Path("src/features/characters/inventory/equipmentBonusFields.tsx")
          fields = fields_path.read_text()
          fields = replace_once(
              fields,
              '  { value: "attackBonus", label: "Ataques" },\n  { value: "damageBonus", label: "Dano" },\n',
              '  { value: "attackBonus", label: "Ataques" },\n  { value: "saveDcBonus", label: "CD de magia e habilidades" },\n  { value: "damageBonus", label: "Dano" },\n',
              'bonus field DC target',
          )
          fields_path.write_text(fields)

          legacy_editor_path = Path("src/features/characters/equipment/equipmentEditDialog.tsx")
          legacy_editor = legacy_editor_path.read_text()
          legacy_editor = replace_once(
              legacy_editor,
              '  | "attackBonus"\n  | "speed"\n',
              '  | "attackBonus"\n  | "saveDcBonus"\n  | "speed"\n',
              'legacy editor DC target type',
          )
          legacy_editor = replace_once(
              legacy_editor,
              '  { value: "attackBonus", label: "Ataque" },\n  { value: "speed", label: "Velocidade" },\n',
              '  { value: "attackBonus", label: "Ataque" },\n  { value: "saveDcBonus", label: "CD de magia e habilidades" },\n  { value: "speed", label: "Velocidade" },\n',
              'legacy editor DC target option',
          )
          legacy_editor_path.write_text(legacy_editor)

          stats_path = Path("src/models/characters/characterStats.ts")
          stats = stats_path.read_text()
          marker = '''export function getEffectiveAttribute(
            character: CharacterTemplate,
            attribute: Attribute,
          ): number {'''
          helpers = '''export function getEffectiveAttackBonus(
            character: CharacterTemplate,
            baseValue: number,
          ): number {
            return applyBonuses(
              baseValue,
              getCharacterBonuses(character, "attackBonus"),
            )
          }

          export function getEffectiveSaveDc(
            character: CharacterTemplate,
            baseValue: number,
          ): number {
            return applyBonuses(
              baseValue,
              getCharacterBonuses(character, "saveDcBonus"),
            )
          }

          '''
          if 'export function getEffectiveSaveDc(' not in stats:
              if marker not in stats:
                  raise SystemExit('character stat helper insertion point not found')
              stats = stats.replace(marker, helpers + marker, 1)

          old_weapon_attack = '''export function getEffectiveWeaponAttackBonus(
            character: CharacterTemplate,
            weapon: Weapon,
            baseValue: number,
          ): number {
            const weaponAttackBonus = weapon.bonuses?.attack?.bonus
              ? resolveBonus(character, weapon.bonuses.attack.bonus)
              : undefined
            const weaponGeneralBonuses = (weapon.bonuses?.attackBonus ?? [])
              .map((bonus) => resolveBonus(character, bonus))
            const abilityBonuses = getAbilityBonuses(character, "attackBonus")

            return applyBonuses(baseValue, [
              ...weaponGeneralBonuses,
              ...abilityBonuses,
              ...(weaponAttackBonus ? [weaponAttackBonus] : []),
            ])
          }'''
          new_weapon_attack = '''export function getEffectiveWeaponAttackBonus(
            character: CharacterTemplate,
            weapon: Weapon,
            baseValue: number,
          ): number {
            const weaponAttackBonus = weapon.bonuses?.attack?.bonus
              ? resolveBonus(character, weapon.bonuses.attack.bonus)
              : undefined

            return applyBonuses(baseValue, [
              ...getCharacterBonuses(character, "attackBonus"),
              ...(weaponAttackBonus ? [weaponAttackBonus] : []),
            ])
          }'''
          stats = replace_once(
              stats,
              old_weapon_attack,
              new_weapon_attack,
              'effective weapon attack calculation',
          )
          stats_path.write_text(stats)

          template_path = Path("src/models/characters/CharacterTemplate.ts")
          template = template_path.read_text()
          template = replace_once(
              template,
              '  getEffectiveArmorClass,\n  getEffectiveAttribute,\n',
              '  getEffectiveArmorClass,\n  getEffectiveAttackBonus,\n  getEffectiveAttribute,\n',
              'character template attack import',
          )
          template = replace_once(
              template,
              '  getEffectivePassivePerception,\n  getEffectiveStat,\n',
              '  getEffectivePassivePerception,\n  getEffectiveSaveDc,\n  getEffectiveStat,\n',
              'character template DC import',
          )
          template = replace_once(
              template,
              '  getEffectiveStat<K extends keyof Sheet["stats"]>(stat: K,): Sheet["stats"][K] {return getEffectiveStat(this, stat)}\n  getEffectiveWeaponAttackBonus',
              '  getEffectiveStat<K extends keyof Sheet["stats"]>(stat: K,): Sheet["stats"][K] {return getEffectiveStat(this, stat)}\n  getEffectiveAttackBonus(baseValue: number): number {return getEffectiveAttackBonus(this, baseValue)}\n  getEffectiveSaveDc(baseValue: number): number {return getEffectiveSaveDc(this, baseValue)}\n  getEffectiveWeaponAttackBonus',
              'character template attack and DC methods',
          )
          template_path.write_text(template)

          calculators_path = Path("src/features/characters/characterSheet/attributeCalculators.tsx")
          calculators = calculators_path.read_text()
          calculators = replace_once(
              calculators,
              '    return getModifier(attribute) + proficiencyBonus\n',
              '    return character.getEffectiveAttackBonus(\n      getModifier(attribute) + proficiencyBonus,\n    )\n',
              'full sheet attack calculation',
          )
          calculators = replace_once(
              calculators,
              '    return 8 + getModifier(attribute) + proficiencyBonus\n',
              '    return character.getEffectiveSaveDc(\n      8 + getModifier(attribute) + proficiencyBonus,\n    )\n',
              'full sheet DC calculation',
          )
          calculators = replace_once(
              calculators,
              '            Valores derivados dos atributos e da proficiência.\n',
              '            Valores derivados dos atributos e da proficiência, incluindo bônus\n            ativos de equipamentos, habilidades e condições.\n',
              'full sheet calculator description',
          )
          calculators = replace_once(
              calculators,
              '           description="Ataque proficiente, sem bônus específico da arma."\n',
              '           description="Ataque proficiente com bônus gerais ativos; bônus específicos da arma entram no ataque real."\n',
              'weapon calculator description',
          )
          calculators = replace_once(
              calculators,
              '           description="Modificador, ataque mágico e CD da magia."\n',
              '           description="Modificador, ataque mágico e CD com bônus ativos."\n',
              'spell calculator description',
          )
          calculators = replace_once(
              calculators,
              '           description="8 + modificador do atributo + proficiência."\n',
              '           description="8 + modificador do atributo + proficiência + bônus ativos de CD."\n',
              'DC calculator description',
          )
          calculators_path.write_text(calculators)

          minimal_path = Path("src/features/characters/characterSheet/minimalCharacterSheet.tsx")
          minimal = minimal_path.read_text()
          minimal = replace_once(
              minimal,
              '                  character.getEffectiveAttributeModifier(attribute) + proficiency,\n',
              '                  character.getEffectiveAttackBonus(\n                    character.getEffectiveAttributeModifier(attribute) + proficiency,\n                  ),\n',
              'minimal weapon attack calculation',
          )
          minimal = replace_once(
              minimal,
              '                       {formatSigned(modifier + proficiency)}\n',
              '                       {formatSigned(\n                         character.getEffectiveAttackBonus(modifier + proficiency),\n                       )}\n',
              'minimal spell attack calculation',
          )
          minimal = replace_once(
              minimal,
              '                       {8 + modifier + proficiency}\n',
              '                       {character.getEffectiveSaveDc(\n                         8 + modifier + proficiency,\n                       )}\n',
              'minimal spell DC calculation',
          )
          minimal = replace_once(
              minimal,
              '              CD {attributeShort(attribute)} {8 + character.getEffectiveAttributeModifier(attribute) + proficiency}\n',
              '              CD {attributeShort(attribute)}{" "}\n              {character.getEffectiveSaveDc(\n                8 + character.getEffectiveAttributeModifier(attribute) + proficiency,\n              )}\n',
              'minimal attribute DC calculation',
          )
          minimal_path.write_text(minimal)

          required = {
              bonus_path: 'saveDcBonus?: Bonus[]',
              stats_path: 'export function getEffectiveSaveDc(',
              template_path: 'getEffectiveSaveDc(baseValue: number)',
              calculators_path: 'character.getEffectiveSaveDc(',
              minimal_path: 'character.getEffectiveSaveDc(',
          }
          for path, needle in required.items():
              if needle not in path.read_text():
                  raise SystemExit(f'{needle} missing from {path}')
          PY

          rm -f .github/attack-dc-bonus-trigger

      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run build

      - name: Commit implementation to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/models/bonuses/Bonus.ts src/lib/formatBonus.ts src/features/characters/inventory/equipmentBonusFields.tsx src/features/characters/equipment/equipmentEditDialog.tsx src/models/characters/characterStats.ts src/models/characters/CharacterTemplate.ts src/features/characters/characterSheet/attributeCalculators.tsx src/features/characters/characterSheet/minimalCharacterSheet.tsx .github/attack-dc-bonus-trigger
          git commit -m "apply active attack and save DC bonuses"
          git push origin HEAD:${{ github.head_ref }}
