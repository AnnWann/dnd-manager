name: Finalize progression source migration

on:
  push:
    branches:
      - feature/auth
    paths:
      - .github/workflows/refactor-progression.yml
  pull_request:
    branches:
      - feature/auth
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature/auth
        uses: actions/checkout@v4
        with:
          ref: feature/auth
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Point consumers at the canonical class modules
        shell: bash
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              target.write_text(text.replace(old, new))

          replace(
              "src/features/characters/progression/CharacterProgressionConfigurator.tsx",
              '''import {
            getClassProgression,
            getFeaturesAtLevel,
            type LevelFeatureDefinition,
          } from "../../../models/leveling/ClassProgression"''',
              '''import {
            getClassProgression,
            getFeaturesAtLevel,
            type LevelFeatureDefinition,
          } from "../../../data/classProgression"''',
          )

          for path, import_line in [
              (
                  "src/features/characters/progression/CharacterProgressionFlow.tsx",
                  'import "../../../models/leveling/ExpandedClassProgression"\n',
              ),
              (
                  "src/features/characters/creation/characterCreationWizard.tsx",
                  'import "../../../models/leveling/ExpandedClassProgression"\n',
              ),
              (
                  "src/views/user/UserCharacterLevelUpView.tsx",
                  'import "../../models/leveling/ExpandedClassProgression"\n',
              ),
          ]:
              replace(path, import_line, "")

          replace(
              "src/features/characters/creation/IntegratedCharacterCreationWizard.tsx",
              '''import {
            getExpandedClassProgression,
            getExpandedFeaturesAtLevel,
          } from "../../../models/leveling/ExpandedClassProgression"''',
              '''import {
            getClassProgression,
            getFeaturesAtLevel,
          } from "../../../data/classProgression"''',
          )
          replace(
              "src/features/characters/creation/IntegratedCharacterCreationWizard.tsx",
              "getExpandedClassProgression",
              "getClassProgression",
          )
          replace(
              "src/features/characters/creation/IntegratedCharacterCreationWizard.tsx",
              "getExpandedFeaturesAtLevel",
              "getFeaturesAtLevel",
          )

          replace(
              "src/models/leveling/SpellSelectionRules.ts",
              '''import {
            getExpandedCantripsKnownAtLevel,
            getExpandedClassProgression,
          } from "./ExpandedClassProgression"''',
              '''import {
            getCantripsKnownAtLevel,
            getClassProgression,
          } from "../../data/classProgression"''',
          )
          replace(
              "src/models/leveling/SpellSelectionRules.ts",
              "getExpandedCantripsKnownAtLevel",
              "getCantripsKnownAtLevel",
          )
          replace(
              "src/models/leveling/SpellSelectionRules.ts",
              "getExpandedClassProgression",
              "getClassProgression",
          )

          replace(
              "src/models/leveling/applyCharacterProgression.ts",
              'from "./ClassProgression"',
              'from "../../data/classProgression"',
          )

          replace(
              "src/models/leveling/materializeProgressionChoices.ts",
              '''import {
            getExpandedClassProgression,
            getExpandedFeaturesAtLevel,
          } from "./ExpandedClassProgression"''',
              '''import {
            getClassProgression,
            getFeaturesAtLevel,
          } from "../../data/classProgression"''',
          )
          replace(
              "src/models/leveling/materializeProgressionChoices.ts",
              "getExpandedClassProgression",
              "getClassProgression",
          )
          replace(
              "src/models/leveling/materializeProgressionChoices.ts",
              "getExpandedFeaturesAtLevel",
              "getFeaturesAtLevel",
          )

          for path in [
              "src/models/leveling/ProgressionAdditionalLocalization.ts",
              "src/models/leveling/ProgressionLocalization.ts",
              "src/models/leveling/SubclassLocalization.ts",
          ]:
              replace(
                  path,
                  'from "./ClassProgression"',
                  'from "../../data/classProgression/types"',
              )

          unused_constants = [
              ("src/data/classProgression/classes/artificer/index.ts", "ARTIFICER_INFUSIONS"),
              ("src/data/classProgression/classes/fighter/subclasses/arcane-archer/index.ts", "ARCANE_SHOTS"),
              ("src/data/classProgression/classes/fighter/subclasses/battle-master/index.ts", "BATTLE_MASTER_MANEUVERS"),
              ("src/data/classProgression/classes/fighter/subclasses/rune-knight/index.ts", "RUNE_KNIGHT_RUNES"),
              ("src/data/classProgression/classes/monk/subclasses/four-elements/index.ts", "ELEMENTAL_DISCIPLINES"),
              ("src/data/classProgression/classes/monk/subclasses/kensei/index.ts", "KENSEI_WEAPONS"),
          ]
          for path, name in unused_constants:
              target = Path(path)
              text = target.read_text()
              text, count = re.subn(
                  rf"^const {name} = .*\n\n",
                  "",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Could not remove unused {name} from {path}")
              target.write_text(text)

          obsolete = [
              "src/data/classProgression/catalog/ClassProgression.ts",
              "src/data/classProgression/catalog/XanatharSubclasses.ts",
              "src/data/classProgression/fromCatalog.ts",
              "src/data/classProgression/applyClassProgressionModules.ts",
              "src/data/classProgression/dice/Die.ts",
              "src/data/classProgression/sheet/Class.ts",
              "src/data/classProgression/.migration-placeholder",
              "src/data/classProgression/.migration-note",
              "src/models/leveling/ClassProgression.ts",
              "src/models/leveling/ExpandedClassProgression.ts",
              "src/models/leveling/XanatharSubclasses.ts",
              ".github/workflows/refactor-progression.yml",
          ]
          for path in obsolete:
              target = Path(path)
              if target.exists():
                  target.unlink()

          forbidden = [
              "models/leveling/ClassProgression",
              "models/leveling/ExpandedClassProgression",
              'from "./ClassProgression"',
              'from "./ExpandedClassProgression"',
              "classProgression/catalog",
              "fromCatalog",
              "applyConfiguredClassProgressions",
              "applyClassProgressionModules",
          ]
          leftovers = []
          for target in Path("src").rglob("*"):
              if not target.is_file() or target.suffix not in {".ts", ".tsx", ".md"}:
                  continue
              text = target.read_text()
              for token in forbidden:
                  if token in text:
                      leftovers.append(f"{target}: {token}")
          if leftovers:
              raise SystemExit("Legacy progression references remain:\n" + "\n".join(leftovers))
          PY

      - name: Install dependencies without rewriting the existing lockfile
        run: npm install --package-lock=false
        env:
          DIRECT_URL: postgresql://user:password@localhost:5432/dnd_manager

      - name: Build
        run: npm run build

      - name: Lint canonical progression data
        run: npx eslint src/data/classProgression

      - name: Commit directly to feature/auth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use class progression modules directly"
          git push origin HEAD:feature/auth
