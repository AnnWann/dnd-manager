name: Apply ability roll and affinity fixes

on:
  push:
    branches:
      - feature/ability-roll-affinity-fixes

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ability-roll-affinity-fixes

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integration patch
        run: |
          python .github/repair_ability_roll_patcher.py
          rm -f .github/repair_ability_roll_patcher.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Build
        run: npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate ability rolls and damage affinities"
          git push origin HEAD:feature/ability-roll-affinity-fixes
