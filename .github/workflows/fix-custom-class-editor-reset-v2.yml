name: Fix custom class editor reset v2

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/fix-custom-class-editor-reset-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server

      - name: Patch editor state synchronization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/characters/characterSheet/classes/CustomClassConfigurationTab.tsx")
          text = path.read_text()

          text = text.replace(
              'import { useEffect, useMemo, useState } from "react"',
              'import { useEffect, useMemo, useRef, useState } from "react"',
              1,
          )

          old = """  const normalizedConfig = useMemo(() => normalizeCustomClassConfig(config), [config])
  const [draft, setDraft] = useState<CustomClassRuntimeConfig>(normalizedConfig)
  const [applying, setApplying] = useState(false)

  useEffect(() => {
    setDraft(normalizedConfig)
  }, [normalizedConfig])
"""
          new = """  const normalizedConfig = useMemo(() => normalizeCustomClassConfig(config), [config])
  const normalizedConfigSignature = JSON.stringify(normalizedConfig)
  const lastConfigSignatureRef = useRef(normalizedConfigSignature)
  const [draft, setDraft] = useState<CustomClassRuntimeConfig>(normalizedConfig)
  const [applying, setApplying] = useState(false)

  useEffect(() => {
    if (lastConfigSignatureRef.current === normalizedConfigSignature) return
    lastConfigSignatureRef.current = normalizedConfigSignature
    setDraft(normalizedConfig)
  }, [normalizedConfig, normalizedConfigSignature])
"""

          if old not in text:
              raise SystemExit("editor synchronization block not found")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-custom-class-editor-reset.yml
          rm -f .github/workflows/fix-custom-class-editor-reset-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep custom class editor draft while typing"
          git push origin HEAD:feature/session-server
