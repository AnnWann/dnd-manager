name: Apply safe character state rename

on:
  push:
    branches:
      - qa
    paths:
      - .github/workflows/apply-character-state-rename.yml

permissions:
  contents: write

jobs:
  rename:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Apply staged rename
        run: python .github/rename_character_state.py

      - name: Remove temporary patch files
        run: rm .github/rename_character_state.py .github/workflows/apply-character-state-rename.yml

      - name: Install frontend dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Build frontend
        run: npm run build

      - name: Install session server dependencies
        run: npm --prefix session-server install --package-lock=false --ignore-scripts

      - name: Typecheck session server
        run: npm run typecheck:session-server

      - name: Commit rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: rename authoritative HP state domain"
          git push origin HEAD:qa

# Triggered explicitly after initial workflow creation.
