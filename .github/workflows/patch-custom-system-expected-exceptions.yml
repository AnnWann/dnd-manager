name: Patch custom system expected exceptions

on:
  push:
    branches:
      - fix/custom-system-expected-exceptions
    paths:
      - scripts/patch-custom-system-expected-exceptions.py
      - .github/workflows/patch-custom-system-expected-exceptions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-system-expected-exceptions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python3 scripts/patch-custom-system-expected-exceptions.py

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma
        run: npm run prisma:generate

      - name: Validate frontend
        run: |
          npm run check:user-workspace-boundaries
          npm run check:vercel-functions
          npm run check:native-selects
          npx tsc -b
          npx vite build

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-custom-system-expected-exceptions.py
          git rm .github/workflows/patch-custom-system-expected-exceptions.yml
          git add src/models/customSystems/CustomAbilityDefinition.ts
          git add src/models/customSystems/CustomSystemDefinition.ts
          git add src/lib/customSystems/CustomAbilityManagement.ts
          git add src/lib/customSystems/CustomAbilityExceptionPresets.ts
          git add src/lib/customSystems/index.ts
          git add src/features/customSystems/CustomAbilityConfigurationEditor.tsx
          git add src/features/characters/settings/CustomSystemAcquisitionExceptionsModal.tsx
          git commit -m "feat: add expected custom system exception presets"
          git push origin HEAD:fix/custom-system-expected-exceptions
