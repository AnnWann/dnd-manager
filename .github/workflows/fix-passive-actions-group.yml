name: Fix passive actions group

on:
  push:
    branches:
      - master
    paths:
      - ".github/fix-passive-actions-trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Insert passive group
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/characters/characterSheet/minimalCharacterActions.tsx')
          text = path.read_text()

          if 'title="Passivas"' not in text:
              title_index = text.index('title="Habilidades do personagem"')
              block_start = text.rfind('<ActionGroup', 0, title_index)
              block_end = text.index('/>', title_index) + 2
              indentation_start = text.rfind('\n', 0, block_start) + 1
              indentation = text[indentation_start:block_start]
              passive_block = (
                  '\n'
                  f'{indentation}<ActionGroup\n'
                  f'{indentation}  title="Passivas"\n'
                  f'{indentation}  entries={{passiveAbilities}}\n'
                  f'{indentation}  onSelect={{open}}\n'
                  f'{indentation}  emptyMessage="Nenhuma habilidade passiva cadastrada."\n'
                  f'{indentation}/>'
              )
              text = text[:block_end] + passive_block + text[block_end:]

          required = [
              'title="Passivas"',
              'entries={passiveAbilities}',
              'function getPassiveAbilities',
              'filter === "passive"',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'missing passive group requirements: {missing}')

          path.write_text(text)
          PY

      - run: rm -f .github/fix-passive-actions-trigger .github/workflows/fix-passive-actions-group.yml
      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "show passive abilities group in action sheet"
          git push origin HEAD:master
