name: Apply formula sheet modifiers

on:
  push:
    branches:
      - feature/formula-sheet-modifiers
    paths:
      - scripts/apply-formula-sheet-modifiers.mjs
      - .github/workflows/apply-formula-sheet-modifiers.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/formula-sheet-modifiers
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation
        run: node scripts/apply-formula-sheet-modifiers.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: add formula-based sheet modifiers [skip ci]"
          git push origin HEAD:feature/formula-sheet-modifiers
