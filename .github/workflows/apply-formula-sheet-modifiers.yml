name: Validate formula sheet modifiers

on:
  push:
    branches:
      - feature/formula-sheet-modifiers
    paths:
      - src/**
      - .github/workflows/apply-formula-sheet-modifiers.yml
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply pending ability activation migration
        if: ${{ hashFiles('.github/apply_ability_activation_and_free_actions.py') != '' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_ability_activation_and_free_actions.py')
          text = path.read_text()
          text = text.replace(
              "'''                 const sourceLabel = getAbilitySourceLabel(''',",
              "'''                const sourceLabel = getAbilitySourceLabel(''',",
          )
          path.write_text(text)
          PY
          python .github/apply_ability_activation_and_free_actions.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/characters/characterSheet/minimalCharacterActions.tsx')
          text = path.read_text()
          old = '''    if ("source" in ability && ability.source === "equipment") {
            return {
              ability,
              sourceLabel: `Equipamento: ${ability.sourceItemName}`,
              source: {
                type: "equipment",
                itemId: ability.sourceItemId,
                abilityId: ability.originalAbilityId,
              } as AbilitySource,
            }
          }'''
          if old not in text:
              old = '''    if ("source" in ability && ability.source === "equipment") {
      return {
        ability,
        sourceLabel: `Equipamento: ${ability.sourceItemName}`,
        source: {
          type: "equipment",
          itemId: ability.sourceItemId,
          abilityId: ability.originalAbilityId,
        } as AbilitySource,
      }
    }'''
          new = '''    if ("source" in ability && ability.source === "equipment") {
      const equipmentAbility = ability as Ability & {
        source: "equipment"
        sourceItemName: string
        sourceItemId: string
        originalAbilityId: string
      }
      return {
        ability: equipmentAbility,
        sourceLabel: `Equipamento: ${equipmentAbility.sourceItemName}`,
        source: {
          type: "equipment",
          itemId: equipmentAbility.sourceItemId,
          abilityId: equipmentAbility.originalAbilityId,
        } as AbilitySource,
      }
    }'''
          if old not in text:
              raise SystemExit('equipment ability narrowing anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/ability-activation-trigger .github/apply_ability_activation_and_free_actions.py

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Build
        run: npm run build

      - name: Commit generated implementation
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "activate ability benefits on use"
          git push origin HEAD:${{ github.head_ref }}
