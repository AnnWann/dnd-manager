name: Apply centralized class creation management

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/apply-session-class-management.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply class management refactor
        shell: bash
        run: |
          git show HEAD^^:.github/workflows/apply-session-class-management.yml > /tmp/patch-workflow.yml
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY[[:space:]]*$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/patch-workflow.yml > /tmp/apply-class-management.py
          test -s /tmp/apply-class-management.py
          python /tmp/apply-class-management.py

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Verify character creation changes
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'src/features/characters/creation/.*\.(ts|tsx)' /tmp/build.log; then
            echo "Character creation files have TypeScript/build errors."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Full build still contains unrelated baseline errors; character creation changes are clean."
          fi

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-session-class-management.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize character class management"
          git push origin HEAD:feature/session-server
