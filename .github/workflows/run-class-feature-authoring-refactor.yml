name: Run class feature authoring refactor

on:
  pull_request:
    branches:
      - feature/auth

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature/auth
        uses: actions/checkout@v4
        with:
          ref: feature/auth
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply refactor
        shell: bash
        run: |
          git fetch origin agent/simplify-class-feature-authoring
          git show origin/agent/simplify-class-feature-authoring:.github/workflows/simplify-class-feature-authoring.yml \
            | sed -n "/^          python <<'PY'$/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' \
            > /tmp/simplify-class-feature-authoring.py
          git show origin/agent/simplify-class-feature-authoring:scripts/fix-class-feature-authoring-refactor.py \
            > /tmp/fix-class-feature-authoring-refactor.py
          python /tmp/simplify-class-feature-authoring.py
          python /tmp/fix-class-feature-authoring-refactor.py
          rm .github/workflows/run-class-feature-authoring-refactor.yml

      - name: Install dependencies without changing lockfile
        run: npm install --package-lock=false
        env:
          DIRECT_URL: postgresql://user:password@localhost:5432/dnd_manager

      - name: Build
        run: npm run build

      - name: Lint changed progression architecture
        run: >-
          npx eslint
          src/data/classProgression
          src/models/leveling/applyCharacterProgression.ts
          src/models/leveling/ProgressionFeatureFinalization.ts
          src/models/leveling/refreshProgressionFeatureMechanics.ts

      - name: Commit directly to feature/auth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify class feature authoring"
          git fetch origin feature/auth
          if ! git merge-base --is-ancestor origin/feature/auth HEAD; then
            git rebase origin/feature/auth
            npm run build
            npx eslint src/data/classProgression src/models/leveling/applyCharacterProgression.ts src/models/leveling/ProgressionFeatureFinalization.ts src/models/leveling/refreshProgressionFeatureMechanics.ts
          fi
          git push origin HEAD:feature/auth
