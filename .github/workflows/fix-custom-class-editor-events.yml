name: Apply custom class editor event fix

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/fix-custom-class-editor-events.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix creation input event ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/features/characters/creation/characterCreationWizard.tsx'): [
                  (
                      '    document.addEventListener("input", clearAfterEdit, true)\n'
                      '    document.addEventListener("change", clearAfterEdit, true)\n',
                      '    // Let React-controlled fields process their edit before clearing\n'
                      '    // wrapper validation errors. Capture-phase listeners can rerender\n'
                      '    // the wizard before React receives the new input/select value.\n'
                      '    document.addEventListener("input", clearAfterEdit)\n'
                      '    document.addEventListener("change", clearAfterEdit)\n',
                  ),
                  (
                      '      document.removeEventListener("input", clearAfterEdit, true)\n'
                      '      document.removeEventListener("change", clearAfterEdit, true)\n',
                      '      document.removeEventListener("input", clearAfterEdit)\n'
                      '      document.removeEventListener("change", clearAfterEdit)\n',
                  ),
              ],
              Path('src/features/characters/creation/bridges/CreationRequiredFieldHighlighter.tsx'): [
                  (
                      '    document.addEventListener("input", clearFeedback, true)\n'
                      '    document.addEventListener("change", clearFeedback, true)\n',
                      '    // Input/change feedback clearing belongs in bubble phase so the\n'
                      '    // controlled field updates before this helper can rerender.\n'
                      '    document.addEventListener("input", clearFeedback)\n'
                      '    document.addEventListener("change", clearFeedback)\n',
                  ),
                  (
                      '      document.removeEventListener("input", clearFeedback, true)\n'
                      '      document.removeEventListener("change", clearFeedback, true)\n',
                      '      document.removeEventListener("input", clearFeedback)\n'
                      '      document.removeEventListener("change", clearFeedback)\n',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one replacement anchor, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/fix-custom-class-editor-events.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep custom class form controls editable"
          git push origin HEAD:feature/session-server
