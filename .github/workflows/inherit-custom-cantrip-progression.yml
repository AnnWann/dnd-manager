name: Inherit custom cantrip progression

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/inherit-custom-cantrip-progression.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply inherited cantrip progression behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/characters/characterSheet/classes/CustomClassConfigurationTab.tsx')
          text = path.read_text()

          old = '''  createCustomSlotPool,\n  getCustomClassConfig,\n  getCustomProgressionValueAtLevel,\n'''
          new = '''  createCustomSlotPool,\n  getCustomCantripsKnownAtLevel,\n  getCustomClassConfig,\n  getCustomProgressionValueAtLevel,\n'''
          if text.count(old) != 1:
              raise SystemExit('import anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''              <p className="mt-1 max-w-3xl text-xs leading-5 text-textMuted">\n                Informe o total de truques conhecidos nos níveis em que esse total muda. Campos vazios mantêm o valor do nível anterior.\n              </p>\n'''
          new = '''              <p className="mt-1 max-w-3xl text-xs leading-5 text-textMuted">\n                Informe o total de truques conhecidos nos níveis em que esse total muda. O último valor é preenchido automaticamente nos níveis seguintes, mas qualquer nível pode sobrescrevê-lo independentemente.\n              </p>\n'''
          if text.count(old) != 1:
              raise SystemExit('description anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''                    value={draft.cantripsKnownProgression[String(level)] ?? ""}\n                    placeholder="—"\n'''
          new = '''                    value={\n                      draft.cantripsKnownProgression[String(level)] ??\n                      (getCustomCantripsKnownAtLevel(draft, level) || "")\n                    }\n                    placeholder="—"\n'''
          if text.count(old) != 1:
              raise SystemExit('cantrip input anchor not found exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/inherit-custom-cantrip-progression.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: inherit custom cantrip progression values"
          git push origin HEAD:feature/session-server
