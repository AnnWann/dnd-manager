name: Fix remaining character creation callback loops

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/fix-creation-callback-loops.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stabilize creation callbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:140]!r}")
              path.write_text(text.replace(old, new, 1))

          racial = Path('src/features/characters/creation/CharacterCreationRacialChoices.tsx')
          replace_once(
              racial,
              'import { useEffect, useMemo, useState } from "react"',
              'import { useEffect, useMemo, useRef, useState } from "react"',
          )
          replace_once(
              racial,
              '''export function CharacterCreationRacialChoices({\n  draftId,\n  onChange,\n  externalError,\n}: Props) {''',
              '''export function CharacterCreationRacialChoices({\n  draftId,\n  onChange,\n  externalError,\n}: Props) {\n  const onChangeRef = useRef(onChange)\n  onChangeRef.current = onChange''',
          )
          replace_once(
              racial,
              '''    onChange({\n      valid,''',
              '''    onChangeRef.current({\n      valid,''',
          )
          replace_once(
              racial,
              '''    })\n    return () => onChange(null)\n  }, [\n    ancestry,\n    featAbility,\n    halfElf,\n    dragonborn,\n    onChange,\n    skillOne,\n    skillTwo,\n    valid,\n    variantHuman,\n  ])''',
              '''    })\n  }, [\n    ancestry,\n    featAbility,\n    halfElf,\n    dragonborn,\n    skillOne,\n    skillTwo,\n    valid,\n    variantHuman,\n  ])\n\n  useEffect(() => {\n    return () => onChangeRef.current(null)\n  }, [])''',
          )

          generic = Path('src/features/characters/creation/CharacterCreationGenericRacialChoices.tsx')
          replace_once(
              generic,
              'import { useEffect, useMemo, useState } from "react"',
              'import { useEffect, useMemo, useRef, useState } from "react"',
          )
          replace_once(
              generic,
              '''export function CharacterCreationGenericRacialChoices({\n  draftId,\n  onChange,\n  externalError,\n}: Props) {''',
              '''export function CharacterCreationGenericRacialChoices({\n  draftId,\n  onChange,\n  externalError,\n}: Props) {\n  const onChangeRef = useRef(onChange)\n  onChangeRef.current = onChange''',
          )
          replace_once(
              generic,
              '''  useEffect(() => {\n    onChange(override)\n    return () => onChange(null)\n  }, [onChange, override])''',
              '''  useEffect(() => {\n    onChangeRef.current(override)\n  }, [override])\n\n  useEffect(() => {\n    return () => onChangeRef.current(null)\n  }, [])''',
          )

          background = Path('src/features/characters/creation/CharacterCreationBackgroundChoices.tsx')
          replace_once(
              background,
              'import { useEffect, useMemo, useState } from "react"',
              'import { useEffect, useMemo, useRef, useState } from "react"',
          )
          replace_once(
              background,
              '''export function CharacterCreationBackgroundChoices({\n  draftId,\n  onChange,\n  externalError,\n}: Props) {''',
              '''export function CharacterCreationBackgroundChoices({\n  draftId,\n  onChange,\n  externalError,\n}: Props) {\n  const onChangeRef = useRef(onChange)\n  onChangeRef.current = onChange''',
          )
          replace_once(
              background,
              '''  useEffect(() => {\n    onChange(override)\n  }, [onChange, override])''',
              '''  useEffect(() => {\n    onChangeRef.current(override)\n  }, [override])''',
          )

          equipment = Path('src/features/characters/creation/components/CharacterCreationEquipmentChoices.tsx')
          replace_once(
              equipment,
              '''}: Props) {\n  const [target, setTarget] = useState<EquipmentTarget | null>(null)\n  const targetRef = useRef<EquipmentTarget | null>(null)''',
              '''}: Props) {\n  const [target, setTarget] = useState<EquipmentTarget | null>(null)\n  const targetRef = useRef<EquipmentTarget | null>(null)\n  const onChangeRef = useRef(onChange)\n  onChangeRef.current = onChange''',
          )
          replace_once(
              equipment,
              '''  useEffect(() => {\n    if (!target) onChange(null)\n  }, [onChange, target])''',
              '''  useEffect(() => {\n    if (!target) onChangeRef.current(null)\n  }, [target])''',
          )
          replace_once(
              equipment,
              '''}) {\n  const preset = getPhbClassEquipmentPreset(className)''',
              '''}) {\n  const onChangeRef = useRef(onChange)\n  onChangeRef.current = onChange\n  const preset = getPhbClassEquipmentPreset(className)''',
          )
          replace_once(
              equipment,
              '''  useEffect(() => {\n    onChange(override)\n  }, [onChange, override])''',
              '''  useEffect(() => {\n    onChangeRef.current(override)\n  }, [override])''',
          )
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/fix-creation-callback-loops.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize character creation bridge callbacks"
          git push origin HEAD:feature/session-server
