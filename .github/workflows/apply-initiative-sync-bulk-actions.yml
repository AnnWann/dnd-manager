name: Apply initiative sync bulk actions

on:
  push:
    branches:
      - agent/initiative-sync-bulk-actions
    paths:
      - .github/workflows/apply-initiative-sync-bulk-actions.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initiative-sync-bulk-actions
          fetch-depth: 0

      - name: Apply main patch
        shell: bash
        run: |
          set +e
          output="$(python .github/patch_initiative_sync_bulk_actions.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          set -e
          if [ "$status" -ne 0 ] && ! printf '%s' "$output" | grep -Fq "anchor not found: initiative log bulk custom"; then
            exit "$status"
          fi

      - name: Apply log continuation
        run: python .github/patch_initiative_sync_bulk_actions_continue.py

      - name: Remove temporary patch files
        run: rm .github/patch_initiative_sync_bulk_actions.py .github/patch_initiative_sync_bulk_actions_continue.py .github/workflows/apply-initiative-sync-bulk-actions.yml

      - name: Install frontend dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Build frontend
        run: npm run build

      - name: Install session server dependencies
        run: npm --prefix session-server install --package-lock=false --ignore-scripts

      - name: Typecheck session server
        run: npm run typecheck:session-server

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: synchronize initiative state and bulk actions"
          git pull --rebase origin agent/initiative-sync-bulk-actions
          git push origin HEAD:agent/initiative-sync-bulk-actions
