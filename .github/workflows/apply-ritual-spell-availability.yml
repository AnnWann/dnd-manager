name: Apply ritual spell availability

on:
  push:
    paths:
      - ".github/workflows/apply-ritual-spell-availability.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update character spell list
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > src/features/characters/magic/knownSpellsList.tsx

          echo '' | base64 --decode | gzip --decompress > src/features/characters/magic/compactSpellCard.tsx

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/characters/magic/knownSpellsList.tsx src/features/characters/magic/compactSpellCard.tsx
          git commit -m "include ritual spells in available list"
          git push
