name: Add none custom system placement
on:
  push:
    branches: [debug/custom-system-none-placement]
jobs:
  patch-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/custom-system-none-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply none placement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/models/customSystems/CustomSystemDefinition.ts')
          text = path.read_text()
          old = '''export type CustomSystemCharacterPlacement =
  | {
      mode: "newTab"'''
          new = '''export type CustomSystemCharacterPlacement =
  | {
      mode: "none"
    }
  | {
      mode: "newTab"'''
          if old not in text:
              raise SystemExit('placement union anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/features/customSystems/CustomSystemPlacementEditor.tsx')
          text = path.read_text()
          text = text.replace(
              "import { LayoutPanelTop, PanelTop, Rows3 } from 'lucide-react'",
              "import { EyeOff, LayoutPanelTop, PanelTop, Rows3 } from 'lucide-react'",
              1,
          )
          anchor = '''  if (placement?.mode === 'newTab') {
'''
          replacement = '''  if (placement?.mode === 'none') {
    return { mode: 'none' }
  }

  if (placement?.mode === 'newTab') {
'''
          if anchor not in text:
              raise SystemExit('get placement anchor not found')
          text = text.replace(anchor, replacement, 1)

          text = text.replace(
              '''      <div className={`mt-4 grid gap-3 md:grid-cols-2 ${draft.hiddenFromSheet ? 'pointer-events-none opacity-45' : ''}`}>
''',
              '''      <div className={`mt-4 grid gap-3 md:grid-cols-3 ${draft.hiddenFromSheet ? 'pointer-events-none opacity-45' : ''}`}>
''',
              1,
          )

          existing_button = '''        <button
          type="button"
          onClick={() =>
            setPlacement({
              mode: 'newTab',
'''
          none_button = '''        <button
          type="button"
          onClick={() => setPlacement({ mode: 'none' })}
          className={`rounded-xl border p-4 text-left transition-colors ${
            placement.mode === 'none'
              ? 'border-accent bg-accentBg'
              : 'border-border hover:bg-bg'
          }`}
        >
          <EyeOff className="h-5 w-5 text-accent" />
          <div className="mt-2 font-medium text-textH">Nenhum</div>
          <p className="mt-1 text-xs text-text">
            O sistema continua ativo e suas regras, recursos, fórmulas e ações continuam funcionando, mas seu conteúdo não aparece em nenhuma aba.
          </p>
        </button>

        <button
          type="button"
          onClick={() =>
            setPlacement({
              mode: 'newTab',
'''
          if existing_button not in text:
              raise SystemExit('button anchor not found')
          text = text.replace(existing_button, none_button, 1)

          old_conditional = '''      {placement.mode === 'newTab' ? (
        <div className="mt-4 grid gap-4 md:grid-cols-3">
'''
          new_conditional = '''      {placement.mode === 'none' ? (
        <div className="mt-4 rounded-xl border border-border bg-bg p-4 text-sm text-textMuted">
          Nenhum conteúdo próprio do sistema será renderizado em abas. Ações configuradas em <strong className="text-textH">Ficha e ações</strong> continuam disponíveis na seção de ações do personagem.
        </div>
      ) : placement.mode === 'newTab' ? (
        <div className="mt-4 grid gap-4 md:grid-cols-3">
'''
          if old_conditional not in text:
              raise SystemExit('conditional anchor not found')
          text = text.replace(old_conditional, new_conditional, 1)
          path.write_text(text)
          PY
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Commit validated change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/models/customSystems/CustomSystemDefinition.ts src/features/customSystems/CustomSystemPlacementEditor.tsx
          git commit -m "Add none placement for custom systems"
          git push origin HEAD:debug/custom-system-none-placement
