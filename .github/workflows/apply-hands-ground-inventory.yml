name: Apply hands and ground inventory

on:
  pull_request:
    paths:
      - ".github/hands-ground-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct implementation anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_hands_ground_inventory.py')
          text = path.read_text()
          text = text.replace(
              "'import type { Attribute } from \"../../../models/sheet/Attribute\"',\n    'import type { Attribute } from \"../../../models/sheet/Attribute\"\\nimport { SpellcastingHandsWarning } from \"./spellcastingHandsWarning\"',",
              "'''import {\n  ATTRIBUTE_KEYS,\n  type Attribute,\n} from \"../../../models/sheet/Attribute\"''',\n    '''import {\n  ATTRIBUTE_KEYS,\n  type Attribute,\n} from \"../../../models/sheet/Attribute\"\nimport { SpellcastingHandsWarning } from \"./spellcastingHandsWarning\"''',",
          )
          path.write_text(text)
          PY

      - name: Apply hands and ground inventory support
        run: python .github/apply_hands_ground_inventory.py

      - name: Remove temporary implementation files
        run: rm -f .github/hands-ground-trigger .github/apply_hands_ground_inventory.py

      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run build

      - name: Commit implementation to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add hands, ground inventory, and casting restrictions"
          git push origin HEAD:${{ github.head_ref }}
