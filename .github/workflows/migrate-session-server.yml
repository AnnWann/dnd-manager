name: Migrate session server workspace

on:
  push:
    branches:
      - refactor/modular-workspaces-foundation
    paths:
      - "scripts/migrate-session-server.mjs"
      - ".github/workflows/migrate-session-server.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'AnnWann/dnd-manager'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Move Worker application
        run: node scripts/migrate-session-server.mjs
      - name: Reconcile npm workspaces
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate workspace boundaries
        run: npm run check:workspace-boundaries && npm run audit:workspace-imports
      - name: Validate portable libraries
        run: |
          npm run typecheck --workspace @dnd-manager/session-protocol
          npm run typecheck --workspace @dnd-manager/game-core
          npm run typecheck --workspace @dnd-manager/session-client
          npm run typecheck --workspace @dnd-manager/game-ui
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify website build
        run: npm run --workspace @dnd-manager/web build
      - name: Verify relocated Worker
        run: npm run --workspace @dnd-manager/session-server-app typecheck
      - name: Commit only after validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: physically relocate session Worker to apps/session-server"
          git push origin HEAD:refactor/modular-workspaces-foundation
