name: Apply custom class select fix

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/fix-custom-class-selects.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use input events for custom class selects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/characters/characterSheet/classes/CustomClassConfigurationTab.tsx')
          text = path.read_text()

          # Native selects emit input as soon as the selected option changes.
          # In the creation flow this avoids the remaining delegated change-event
          # interference while keeping the editor fully controlled by React.
          pattern = re.compile(r'<Select\b(?:(?!</Select>).)*?</Select>', re.S)
          matches = list(pattern.finditer(text))
          if len(matches) != 6:
              raise SystemExit(f'expected 6 custom class Select blocks, found {len(matches)}')

          def patch_select(match: re.Match[str]) -> str:
              block = match.group(0)
              if block.count('onChange=') != 1:
                  raise SystemExit('custom class Select block does not contain exactly one onChange handler')
              block = block.replace('onChange=', 'onInput=', 1)
              block = block.replace('event.target.value', 'event.currentTarget.value')
              return block

          text = pattern.sub(patch_select, text)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/fix-custom-class-selects.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make custom class selects responsive"
          git push origin HEAD:feature/session-server
