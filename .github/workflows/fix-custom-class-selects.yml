name: Apply custom class select fix

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/fix-custom-class-selects.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore class creation configuration actions
        run: python scripts/restore-class-creation-actions.py

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/restore-class-creation-actions.py
          rm -f .github/workflows/fix-custom-class-selects.yml
          rm -f .github/workflows/restore-class-creation-actions.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore class configuration actions during creation"
          git push origin HEAD:feature/session-server
