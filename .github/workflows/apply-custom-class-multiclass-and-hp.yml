name: Apply custom class multiclass and HP fix

on:
  push:
    branches:
      - qa
    paths:
      - .github/apply_custom_class_multiclass_and_hp.py
      - .github/workflows/apply-custom-class-multiclass-and-hp.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply targeted fixes
        run: python .github/apply_custom_class_multiclass_and_hp.py

      - name: Remove temporary patch files
        run: rm -f .github/apply_custom_class_multiclass_and_hp.py .github/workflows/apply-custom-class-multiclass-and-hp.yml

      - name: Install frontend dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build frontend
        run: npm run build

      - name: Install session-server dependencies
        run: npm --prefix session-server install --package-lock=false --ignore-scripts

      - name: Typecheck session server
        run: npm run typecheck:session-server

      - name: Commit validated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support custom multiclass configuration and level-up hp"
          git push origin HEAD:qa
