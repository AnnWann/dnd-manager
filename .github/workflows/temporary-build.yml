name: Temporary build diagnostics

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --silent > /dev/null 2>&1
      - name: Build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          tail -120 build.log
          exit $status
