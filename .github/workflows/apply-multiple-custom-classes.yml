name: Apply multiple custom classes

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/apply-multiple-custom-classes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply multiple custom class support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return next_text

          # ------------------------------------------------------------------
          # customClassConfig.ts: unique runtime ids + targetable config/pools
          # ------------------------------------------------------------------
          path = Path('src/models/characters/customClassConfig.ts')
          text = path.read_text()
          text = replace_once(
              text,
              'export const CUSTOM_CLASS_RUNTIME_ID = "__custom__" as ClassName\n',
              '''export const CUSTOM_CLASS_RUNTIME_ID = "__custom__" as ClassName\nconst CUSTOM_CLASS_RUNTIME_PREFIX = `${String(CUSTOM_CLASS_RUNTIME_ID)}-`\n\nexport function isCustomClassName(\n  className: ClassName | string | undefined,\n): boolean {\n  const value = String(className ?? "")\n  return (\n    value === String(CUSTOM_CLASS_RUNTIME_ID) ||\n    value.startsWith(CUSTOM_CLASS_RUNTIME_PREFIX)\n  )\n}\n\nexport function createCustomClassRuntimeId(): ClassName {\n  const suffix =\n    typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"\n      ? crypto.randomUUID()\n      : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`\n  return `${CUSTOM_CLASS_RUNTIME_PREFIX}${suffix}` as ClassName\n}\n''',
              'custom runtime helpers',
          )
          text = sub_once(
              text,
              r'export function isCustomClassEntry\([\s\S]*?\n}\n\nexport function createCustomClassEntry\([\s\S]*?\n}\n\nexport function getCustomClassIndex\([\s\S]*?\n}\n',
              '''export function isCustomClassEntry(entry: CharacterClassInterface | undefined): boolean {\n  return Boolean(\n    entry &&\n      (isCustomClassName(entry.className) ||\n        entry.levelChoices?.[CUSTOM_CLASS_CHOICE_KEY]?.length),\n  )\n}\n\nexport function createCustomClassEntry(\n  name = "Classe personalizada",\n  className: ClassName = createCustomClassRuntimeId(),\n): CharacterClassInterface {\n  const config = normalizeCustomClassConfig({ ...DEFAULT_CUSTOM_CLASS_CONFIG, name })\n  return {\n    className,\n    level: 1,\n    levelChoices: {\n      [CUSTOM_CLASS_CHOICE_KEY]: [config.name],\n      [CUSTOM_CLASS_CONFIG_KEY]: [JSON.stringify(config)],\n    },\n  }\n}\n\nexport function getCustomClassIndex(\n  character: CharacterTemplate,\n  className?: ClassName,\n): number {\n  const classes = character.get("sheet").classes ?? []\n  if (className) {\n    return classes.findIndex(\n      (entry) => entry.className === className && isCustomClassEntry(entry),\n    )\n  }\n  return classes.findIndex(isCustomClassEntry)\n}\n''',
              'custom entry/index functions',
          )
          text = sub_once(
              text,
              r'export function getCustomClassConfig\([\s\S]*?\n}\n\nexport function updateCustomClassConfig\([\s\S]*?\n}\n\nexport function createCustomSlotPool',
              '''export function getCustomClassConfig(\n  character: CharacterTemplate,\n  className?: ClassName,\n): CustomClassRuntimeConfig | undefined {\n  const index = getCustomClassIndex(character, className)\n  if (index < 0) return undefined\n  return getCustomClassConfigFromEntry(character.get("sheet").classes?.[index])\n}\n\nexport function updateCustomClassConfig(\n  character: CharacterTemplate,\n  config: CustomClassRuntimeConfig,\n  className?: ClassName,\n): CharacterTemplate {\n  const index = getCustomClassIndex(character, className)\n  if (index < 0) return character\n  const normalized = normalizeCustomClassConfig(config)\n  const classes = [...(character.get("sheet").classes ?? [])]\n  const entry = classes[index]\n  if (!entry) return character\n  classes[index] = {\n    ...entry,\n    className: entry.className,\n    castingAttribute: normalized.casterType === "none" ? undefined : normalized.castingAttribute,\n    spellcastingProgression:\n      normalized.casterType === "none" || normalized.slotProgressionMode === "table"\n        ? undefined\n        : normalized.casterType,\n    knownSpells: normalized.casterType === "none" ? undefined : {\n      mode: normalized.knownSpellMode,\n      baseAtLevel1: normalized.knownSpellMode === "prepared-only" ? 0 : normalized.knownAtLevel1,\n      perLevel: normalized.knownSpellMode === "prepared-only" ? 0 : normalized.knownPerLevel,\n    },\n    levelChoices: {\n      ...(entry.levelChoices ?? {}),\n      [CUSTOM_CLASS_CHOICE_KEY]: [normalized.name],\n      [CUSTOM_CLASS_CONFIG_KEY]: [JSON.stringify(normalized)],\n    },\n  }\n  return character.withSheet("classes", classes)\n}\n\nexport function createCustomSlotPool''',
              'targetable custom config',
          )
          text = sub_once(
              text,
              r'export function getCustomSpellSlotPools\([\s\S]*?\n}\n\nexport function spendCustomSpellSlot',
              '''export function getCustomSpellSlotPools(character: CharacterTemplate): CustomSpellSlotPool[] {\n  const result: CustomSpellSlotPool[] = []\n  const classes = character.get("sheet").classes ?? []\n\n  classes.forEach((classEntry, index) => {\n    const config = getCustomClassConfigFromEntry(classEntry)\n    if (!config) return\n    const level = String(classEntry.level)\n    const state = readState(character, index)\n\n    for (const pool of config.additionalSlotPools) {\n      const slots: CustomSpellSlotPool["slots"] = {}\n      const row = pool.progression[level] ?? {}\n      for (let circle = 1; circle <= 9; circle += 1) {\n        const key = String(circle)\n        const max = Math.max(0, Math.trunc(Number(row[key] ?? 0)))\n        if (max <= 0) continue\n        const current = state[pool.id]?.[key]\n        slots[circle] = {\n          level: circle,\n          max,\n          current: Math.min(max, Math.max(0, current ?? max)),\n        }\n      }\n      if (Object.keys(slots).length > 0) {\n        result.push({\n          id: pool.id,\n          name: pool.name,\n          recovery: pool.recovery,\n          slots,\n        })\n      }\n    }\n  })\n\n  return result\n}\n\nexport function spendCustomSpellSlot''',
              'aggregate custom pools',
          )
          text = sub_once(
              text,
              r'function changeSlot\([\s\S]*?\n}\n\nfunction readState',
              '''function changeSlot(character: CharacterTemplate, poolId: string, level: number, delta: number): CharacterTemplate {\n  const classes = character.get("sheet").classes ?? []\n\n  for (let index = 0; index < classes.length; index += 1) {\n    const classEntry = classes[index]\n    const config = getCustomClassConfigFromEntry(classEntry)\n    if (!config) continue\n    const pool = config.additionalSlotPools.find((candidate) => candidate.id === poolId)\n    if (!pool) continue\n\n    const key = String(level)\n    const row = pool.progression[String(classEntry.level)] ?? {}\n    const max = Math.max(0, Math.trunc(Number(row[key] ?? 0)))\n    if (max <= 0) return character\n\n    const state = readState(character, index)\n    const current = Math.min(max, Math.max(0, state[poolId]?.[key] ?? max))\n    const next = Math.max(0, Math.min(max, current + delta))\n    if (next === current) return character\n\n    state[poolId] = { ...(state[poolId] ?? {}), [key]: next }\n    return writeState(character, index, state)\n  }\n\n  return character\n}\n\nfunction readState''',
              'target pool slot state',
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # customClassProgression.ts: target a specific custom class
          # ------------------------------------------------------------------
          path = Path('src/models/characters/customClassProgression.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  getCustomClassConfig,\n  getCustomClassIndex,\n',
              '  getCustomClassConfig,\n  getCustomClassConfigFromEntry,\n  getCustomClassIndex,\n',
              'custom progression config import',
          )
          text = replace_once(
              text,
              'import type { ClassLevel } from "../sheet/Class"\n',
              'import type { ClassLevel, ClassName } from "../sheet/Class"\n',
              'custom progression class name import',
          )
          text = sub_once(
              text,
              r'export function applyCustomClassCreationConfiguration\([\s\S]*?\n}\n\nexport function applyCustomClassLevelUp',
              '''export function applyCustomClassCreationConfiguration(\n  character: CharacterTemplate,\n  config: CustomClassRuntimeConfig,\n  selectedSkills: Skill[] = [],\n  className?: ClassName,\n): CharacterTemplate {\n  if (getCustomClassIndex(character, className) < 0) return character\n\n  const normalized = normalizeCustomClassConfig(config)\n  let next = updateCustomClassConfig(character, normalized, className)\n  const customIndex = getCustomClassIndex(next, className)\n\n  if (customIndex === 0) {\n    const current = next.get("sheet").savingThrowProficiencies ?? {}\n    const savingThrows = { ...current }\n    for (const attribute of ATTRIBUTES) {\n      savingThrows[attribute] = normalized.savingThrows.includes(attribute)\n    }\n    next = next.withSheet("savingThrowProficiencies", savingThrows)\n  }\n\n  if (selectedSkills.length) {\n    const skills = { ...next.get("sheet").skills }\n    for (const skill of selectedSkills.slice(0, normalized.skillChoices)) {\n      if (skills[skill] !== "expertise") skills[skill] = "proficient"\n    }\n    next = next.withSheet("skills", skills)\n  }\n\n  next = recalculateCreationHp(next)\n  return next.syncMagicWithClasses()\n}\n\nexport function applyCustomClassLevelUp''',
              'target custom creation configuration',
          )
          text = sub_once(
              text,
              r'function recalculateCreationHp\([\s\S]*?\n}\n\nfunction addCustomLevelHp',
              '''function recalculateCreationHp(\n  character: CharacterTemplate,\n): CharacterTemplate {\n  const conModifier = character.getAttributeModifier("con")\n  const hitDice: HP["hitDice"] = {}\n  let max = 0\n  let firstLevel = true\n\n  for (const classEntry of character.get("sheet").classes ?? []) {\n    const hitDie = isCustomClassEntry(classEntry)\n      ? getCustomClassConfigFromEntry(classEntry)?.hitDie ?? "d8"\n      : getClassProgression(classEntry.className).hitDie\n    const sides = Number(hitDie.slice(1)) || 6\n    const currentPool = hitDice[hitDie] ?? {\n      max: { quantity: 0, sides: hitDie },\n      current: { quantity: 0, sides: hitDie },\n    }\n\n    hitDice[hitDie] = {\n      max: {\n        quantity: currentPool.max.quantity + classEntry.level,\n        sides: hitDie,\n      },\n      current: {\n        quantity: currentPool.current.quantity + classEntry.level,\n        sides: hitDie,\n      },\n    }\n\n    for (let level = 1; level <= classEntry.level; level += 1) {\n      max += Math.max(\n        1,\n        (firstLevel ? sides : Math.floor(sides / 2) + 1) + conModifier,\n      )\n      firstLevel = false\n    }\n  }\n\n  return character.withSheet("HP", {\n    max: Math.max(1, max),\n    current: Math.max(1, max),\n    temporary: 0,\n    hitDice,\n  })\n}\n\nfunction addCustomLevelHp''',
              'per-custom hit dice',
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # Structural class helpers must recognize generated custom ids.
          # ------------------------------------------------------------------
          path = Path('src/data/classProgression/registry.ts')
          text = path.read_text()
          text = replace_once(
              text,
              'const CUSTOM_CLASS_RUNTIME_ID = "__custom__"\n',
              '''const CUSTOM_CLASS_RUNTIME_ID = "__custom__"\nconst CUSTOM_CLASS_RUNTIME_PREFIX = `${CUSTOM_CLASS_RUNTIME_ID}-`\n\nfunction isCustomRuntimeClass(className: ClassName): boolean {\n  const value = String(className)\n  return value === CUSTOM_CLASS_RUNTIME_ID || value.startsWith(CUSTOM_CLASS_RUNTIME_PREFIX)\n}\n''',
              'registry custom predicate',
          )
          text = text.replace(
              'if (String(className) === CUSTOM_CLASS_RUNTIME_ID) return CUSTOM_CLASS_REFERENCE',
              'if (isCustomRuntimeClass(className)) return CUSTOM_CLASS_REFERENCE',
          )
          text = text.replace(
              'if (String(className) === CUSTOM_CLASS_RUNTIME_ID) return 0',
              'if (isCustomRuntimeClass(className)) return 0',
          )
          path.write_text(text)

          path = Path('src/models/leveling/ClassProficiencyRules.ts')
          text = path.read_text()
          text = replace_once(
              text,
              'const EMPTY_RULE: ClassProficiencyRule = {\n',
              '''function isCustomRuntimeClass(className: ClassName): boolean {\n  const value = String(className)\n  return value === "__custom__" || value.startsWith("__custom__-")\n}\n\nconst EMPTY_RULE: ClassProficiencyRule = {\n''',
              'proficiency custom predicate',
          )
          text = text.replace(
              'if (String(className) === "__custom__") return EMPTY_RULE',
              'if (isCustomRuntimeClass(className)) return EMPTY_RULE',
          )
          path.write_text(text)

          path = Path('src/models/leveling/ClassLocalization.ts')
          text = path.read_text()
          text = replace_once(
              text,
              'export function getClassNamePt(className: ClassName): string {\n  return CLASS_NAME_PT[String(className)] ?? String(className)\n}\n',
              '''export function getClassNamePt(className: ClassName): string {\n  const value = String(className)\n  if (value === "__custom__" || value.startsWith("__custom__-")) {\n    return "Classe personalizada"\n  }\n  return CLASS_NAME_PT[value] ?? value\n}\n''',
              'custom localization',
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # Spell selection: resolve the exact custom class entry/config.
          # ------------------------------------------------------------------
          path = Path('src/models/leveling/SpellSelectionRules.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  getCustomClassConfigFromEntry,\n  isCustomClassEntry,\n',
              '  getCustomClassConfigFromEntry,\n  isCustomClassEntry,\n  isCustomClassName,\n',
              'spell custom predicate import',
          )
          text = replace_once(
              text,
              '''  if (String(className) === String(CUSTOM_CLASS_RUNTIME_ID)) {\n    return getCustomSpellSelectionRule(character, level, subclassId)\n  }\n''',
              '''  if (isCustomClassName(className)) {\n    return getCustomSpellSelectionRule(character, className, level, subclassId)\n  }\n''',
              'spell custom rule dispatch',
          )
          text = sub_once(
              text,
              r'function getCustomSpellSelectionRule\([\s\S]*?\n}\n\nexport function getSpellReplacementLimit',
              '''function getCustomSpellSelectionRule(\n  character: CharacterTemplate,\n  className: ClassName,\n  level: number,\n  subclassId?: string,\n): ClassSpellSelectionRule {\n  const stored = (character.get("sheet").classes ?? []).find(\n    (entry) => entry.className === className && isCustomClassEntry(entry),\n  )\n  const baseEntry = stored ?? createCustomClassEntry("Classe personalizada", className)\n  const entry: CharacterClassInterface = {\n    ...baseEntry,\n    className,\n    level: level as ClassLevel,\n  }\n  const config = getCustomClassConfigFromEntry(entry)\n\n  if (!config || config.casterType === "none") {\n    return {\n      className,\n      classLevel: level,\n      subclassId,\n      mode: "none",\n      maxSpellLevel: 0,\n      maxCantrips: 0,\n      maxLeveledSpells: 0,\n      swap: { leveledKnown: 0, cantrips: 0 },\n    }\n  }\n\n  const slots = deriveLeveledSlotsFromClasses([entry])\n  const maxSpellLevel = Math.max(\n    0,\n    ...Object.entries(slots)\n      .filter(([, slot]) => (slot?.max ?? 0) > 0)\n      .map(([circle]) => Number(circle)),\n  ) as MagicCircleLevel\n  const mode: SpellSelectionMode =\n    config.knownSpellMode === "spellbook"\n      ? "spellbook"\n      : config.knownSpellMode === "prepared-only"\n        ? "prepared"\n        : "limited-known"\n  const maxLeveledSpells =\n    config.knownSpellMode === "prepared-only"\n      ? 0\n      : Math.max(\n          0,\n          Math.floor(\n            config.knownAtLevel1 +\n              Math.max(0, level - 1) * config.knownPerLevel,\n          ),\n        )\n\n  return {\n    className,\n    classLevel: level,\n    subclassId,\n    mode: maxSpellLevel === 0 ? "none" : mode,\n    castingAttribute: config.castingAttribute,\n    maxSpellLevel,\n    maxCantrips: 0,\n    maxLeveledSpells,\n    swap: { leveledKnown: 0, cantrips: 0 },\n  }\n}\n\nexport function getSpellReplacementLimit''',
              'exact custom spell rule',
          )
          text = replace_once(
              text,
              '''  if (\n    String(rule.className) !== String(CUSTOM_CLASS_RUNTIME_ID) &&\n    !spell.classes.includes(rule.className)\n  ) {\n''',
              '''  if (!isCustomClassName(rule.className) && !spell.classes.includes(rule.className)) {\n''',
              'spell class list predicate',
          )
          text = replace_once(
              text,
              '''  if (String(className) === String(CUSTOM_CLASS_RUNTIME_ID)) {\n    return {\n      ...createCustomClassEntry(),\n      level: normalizedLevel,\n    }\n  }\n''',
              '''  if (isCustomClassName(className)) {\n    return {\n      ...createCustomClassEntry("Classe personalizada", className),\n      className,\n      level: normalizedLevel,\n    }\n  }\n''',
              'create exact custom class entry',
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # Creation wrapper: store config per generated custom class id.
          # ------------------------------------------------------------------
          path = Path('src/features/characters/creation/characterCreationWizard.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              '  DEFAULT_CUSTOM_CLASS_CONFIG,\n  hasCustomClass,\n',
              '  DEFAULT_CUSTOM_CLASS_CONFIG,\n  getCustomClassConfigFromEntry,\n  hasCustomClass,\n  isCustomClassEntry,\n',
              'wrapper custom imports',
          )
          text = replace_once(
              text,
              '''  | "customClassName"\n  | "customClassConfig"\n  | "onApplyCustomClassConfig"\n>''',
              '''  | "customClassName"\n  | "customClassConfigs"\n  | "onApplyCustomClassConfig"\n  | "onRemoveCustomClassConfig"\n>''',
              'wrapper omitted custom props',
          )
          text = replace_once(
              text,
              '''  subclasses: Partial<Record<ClassName, ManualSubclassSelection>>\n  customClassConfig?: CustomClassRuntimeConfig\n}''',
              '''  subclasses: Partial<Record<ClassName, ManualSubclassSelection>>\n  customClassConfig?: CustomClassRuntimeConfig\n  customClassConfigs?: Record<string, CustomClassRuntimeConfig>\n}''',
              'wrapper draft custom config map',
          )
          text = replace_once(
              text,
              '''  const [customClassConfig, setCustomClassConfig] =\n    useState<CustomClassRuntimeConfig>(createCustomClassDraft)\n''',
              '''  const [customClassConfigs, setCustomClassConfigs] = useState<\n    Record<string, CustomClassRuntimeConfig>\n  >({})\n''',
              'wrapper custom config map state',
          )
          text = replace_once(
              text,
              '      setCustomClassConfig(createCustomClassDraft())\n',
              '      setCustomClassConfigs({})\n',
              'wrapper reset custom config map',
          )
          text = replace_once(
              text,
              '''      if (cached.customClassConfig) {\n        setCustomClassConfig(\n          normalizeCustomClassConfig(cached.customClassConfig),\n        )\n      }\n''',
              '''      if (cached.customClassConfigs) {\n        setCustomClassConfigs(\n          Object.fromEntries(\n            Object.entries(cached.customClassConfigs).map(([className, config]) => [\n              className,\n              normalizeCustomClassConfig(config),\n            ]),\n          ),\n        )\n      } else if (cached.customClassConfig) {\n        setCustomClassConfigs({\n          __custom__: normalizeCustomClassConfig(cached.customClassConfig),\n        })\n      }\n''',
              'wrapper hydrate custom config map',
          )
          text = replace_once(
              text,
              '''      subclasses,\n      customClassConfig,\n    } satisfies WrapperDraft)''',
              '''      subclasses,\n      customClassConfigs,\n    } satisfies WrapperDraft)''',
              'wrapper persist custom config map',
          )
          text = replace_once(
              text,
              '''    customClassConfig,\n    draftHydrated,''',
              '''    customClassConfigs,\n    draftHydrated,''',
              'wrapper custom config map dependency',
          )
          text = replace_once(
              text,
              '''    if (hasCustomClass(configured)) {\n      configured = applyCustomClassCreationConfiguration(\n        configured,\n        customClassConfig,\n      )\n    }\n''',
              '''    if (hasCustomClass(configured)) {\n      for (const classEntry of configured.get("sheet").classes ?? []) {\n        if (!isCustomClassEntry(classEntry)) continue\n        const config =\n          customClassConfigs[String(classEntry.className)] ??\n          getCustomClassConfigFromEntry(classEntry)\n        if (!config) continue\n        configured = applyCustomClassCreationConfiguration(\n          configured,\n          config,\n          [],\n          classEntry.className,\n        )\n      }\n    }\n''',
              'wrapper apply every custom config',
          )
          text = replace_once(
              text,
              '''        customClassName={customClassConfig.name}\n        customClassConfig={customClassConfig}\n        onApplyCustomClassConfig={(next) =>\n          setCustomClassConfig(normalizeCustomClassConfig(next))\n        }\n''',
              '''        customClassName="Classe personalizada"\n        customClassConfigs={customClassConfigs}\n        onApplyCustomClassConfig={(className, next) =>\n          setCustomClassConfigs((current) => ({\n            ...current,\n            [String(className)]: normalizeCustomClassConfig(next),\n          }))\n        }\n        onRemoveCustomClassConfig={(className) =>\n          setCustomClassConfigs((current) => {\n            const next = { ...current }\n            delete next[String(className)]\n            return next\n          })\n        }\n''',
              'wrapper pass custom config map',
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # Integrated creation wizard: custom option can be added repeatedly.
          # ------------------------------------------------------------------
          path = Path('src/features/characters/creation/IntegratedCharacterCreationWizard.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              '''import {\n  CUSTOM_CLASS_RUNTIME_ID,\n  type CustomClassRuntimeConfig,\n} from "../../../models/characters/customClassConfig"\n''',
              '''import {\n  CUSTOM_CLASS_RUNTIME_ID,\n  DEFAULT_CUSTOM_CLASS_CONFIG,\n  createCustomClassRuntimeId,\n  isCustomClassName,\n  normalizeCustomClassConfig,\n  updateCustomClassConfig,\n  type CustomClassRuntimeConfig,\n} from "../../../models/characters/customClassConfig"\n''',
              'integrated custom imports',
          )
          text = replace_once(
              text,
              '''  customClassName?: string\n  customClassConfig?: CustomClassRuntimeConfig\n  onApplyCustomClassConfig?: (config: CustomClassRuntimeConfig) => void\n  mode?: "modal" | "page"''',
              '''  customClassName?: string\n  customClassConfigs?: Record<string, CustomClassRuntimeConfig>\n  onApplyCustomClassConfig?: (\n    className: ClassName,\n    config: CustomClassRuntimeConfig,\n  ) => void\n  onRemoveCustomClassConfig?: (className: ClassName) => void\n  mode?: "modal" | "page"''',
              'integrated custom props',
          )
          text = replace_once(
              text,
              '''  customClassName = "Classe personalizada",\n  customClassConfig,\n  onApplyCustomClassConfig,\n  mode = "modal",''',
              '''  customClassName = "Classe personalizada",\n  customClassConfigs,\n  onApplyCustomClassConfig,\n  onRemoveCustomClassConfig,\n  mode = "modal",''',
              'integrated custom props destructure',
          )
          text = replace_once(
              text,
              '''  const primaryClass = classPlans[0]?.className ?? firstClass.id\n  const primaryClassLabel =\n    String(primaryClass) === String(CUSTOM_CLASS_RUNTIME_ID)\n      ? customClassName.trim() || getClassNamePt(primaryClass)\n      : getClassNamePt(primaryClass)\n  const primaryPreset =\n    PHB_CLASS_PRESETS.find((entry) => entry.id === primaryClass) ?? firstClass\n  const draftCharacter = createDraftCharacter({\n    name,\n    owner: chosenOwner,\n    visibility,\n    race,\n    attributes,\n    classPlans,\n  })\n''',
              '''  const primaryClass = classPlans[0]?.className ?? firstClass.id\n  const primaryCustomConfig = customClassConfigs?.[String(primaryClass)]\n  const primaryClassLabel = isCustomClassName(primaryClass)\n    ? primaryCustomConfig?.name.trim() ||\n      customClassName.trim() ||\n      getClassNamePt(primaryClass)\n    : getClassNamePt(primaryClass)\n  const primaryPreset =\n    PHB_CLASS_PRESETS.find((entry) => entry.id === primaryClass) ?? firstClass\n  const baseDraftCharacter = createDraftCharacter({\n    name,\n    owner: chosenOwner,\n    visibility,\n    race,\n    attributes,\n    classPlans,\n  })\n  const draftCharacter = classPlans.reduce((current, plan) => {\n    if (!isCustomClassName(plan.className)) return current\n    const config = customClassConfigs?.[String(plan.className)]\n    return config\n      ? updateCustomClassConfig(current, config, plan.className)\n      : current\n  }, baseDraftCharacter)\n''',
              'integrated draft custom configs',
          )
          text = sub_once(
              text,
              r'  function addClass\(className: ClassName\) \{[\s\S]*?\n  }\n\n  function removeClass',
              '''  function addClass(className: ClassName) {\n    const addingCustom =\n      String(className) === String(CUSTOM_CLASS_RUNTIME_ID)\n    const runtimeClassName = addingCustom\n      ? createCustomClassRuntimeId()\n      : className\n\n    if (classPlans.some((plan) => plan.className === runtimeClassName)) return\n\n    const addCustomConfig = () => {\n      if (!addingCustom || !onApplyCustomClassConfig) return\n      onApplyCustomClassConfig(\n        runtimeClassName,\n        normalizeCustomClassConfig({\n          ...DEFAULT_CUSTOM_CLASS_CONFIG,\n          savingThrows: [...DEFAULT_CUSTOM_CLASS_CONFIG.savingThrows],\n          spellSlotProgression: {},\n          additionalSlotPools: [],\n        }),\n      )\n    }\n\n    if (!classPlans.length) {\n      addCustomConfig()\n      setClassPlans([createPlan(runtimeClassName, totalLevel)])\n      setClassSkillSelections({})\n      setClassToolChoices({})\n      setCustomClassAbilities([])\n      setSpellSelections({})\n      setSelectedMetamagics([])\n      setClassEquipmentItems(defaultClassEquipment(runtimeClassName))\n      const preset = PHB_CLASS_PRESETS.find(\n        (entry) => entry.id === runtimeClassName,\n      )\n      if (preset) setAttributes({ ...preset.recommendedAttributes })\n      return\n    }\n\n    const donor = classPlans.find((plan) => plan.level > 1)\n    if (!donor || classPlans.length >= totalLevel) return\n    addCustomConfig()\n    setClassPlans((current) => [\n      ...current.map((plan) =>\n        plan.className === donor.className\n          ? { ...plan, level: plan.level - 1 }\n          : plan,\n      ),\n      createPlan(runtimeClassName, 1),\n    ])\n  }\n\n  function removeClass''',
              'integrated add repeated custom class',
          )
          text = replace_once(
              text,
              '''    if (className === "sorcerer") setSelectedMetamagics([])\n\n    if (removedIndex === 0) {''',
              '''    if (className === "sorcerer") setSelectedMetamagics([])\n    if (isCustomClassName(className)) {\n      onRemoveCustomClassConfig?.(className)\n    }\n\n    if (removedIndex === 0) {''',
              'integrated cleanup custom config',
          )
          text = replace_once(
              text,
              '''              customClassName={customClassName}\n              customClassConfig={customClassConfig}\n              blockedSkills={blockedClassSkills}''',
              '''              customClassName={customClassName}\n              customClassConfigs={customClassConfigs}\n              blockedSkills={blockedClassSkills}''',
              'classes step custom map prop',
          )
          text = replace_once(
              text,
              '''              onAddClass={addClass}\n              onRemoveClass={removeClass}\n              onApplyCustomClassConfig={onApplyCustomClassConfig}\n''',
              '''              onAddClass={addClass}\n              onRemoveClass={removeClass}\n              onApplyCustomClassConfig={onApplyCustomClassConfig}\n''',
              'classes step callback anchor',
          )
          text = replace_once(
              text,
              '''              classPlans={classPlans}\n              customClassName={customClassName}\n              classEquipmentItems={classEquipmentItems}''',
              '''              classPlans={classPlans}\n              customClassName={customClassName}\n              customClassConfigs={customClassConfigs}\n              classEquipmentItems={classEquipmentItems}''',
              'review custom config map prop',
          )
          # ClassesStep prop names/types.
          text = replace_once(
              text,
              '''  classPlans,\n  customClassName,\n  customClassConfig,\n  blockedSkills,''',
              '''  classPlans,\n  customClassName,\n  customClassConfigs,\n  blockedSkills,''',
              'classes step custom map destructure',
          )
          text = replace_once(
              text,
              '''  classPlans: ProgressionClassPlan[]\n  customClassName: string\n  customClassConfig?: CustomClassRuntimeConfig\n  blockedSkills: Set<Skill>''',
              '''  classPlans: ProgressionClassPlan[]\n  customClassName: string\n  customClassConfigs?: Record<string, CustomClassRuntimeConfig>\n  blockedSkills: Set<Skill>''',
              'classes step custom map type',
          )
          text = replace_once(
              text,
              '''  onApplyCustomClassConfig?: (config: CustomClassRuntimeConfig) => void\n  onShiftLevel:''',
              '''  onApplyCustomClassConfig?: (\n    className: ClassName,\n    config: CustomClassRuntimeConfig,\n  ) => void\n  onShiftLevel:''',
              'classes step custom callback type',
          )
          text = replace_once(
              text,
              '''  const selectedAlreadyAdded =\n    newClass !== "" &&\n    classPlans.some((plan) => plan.className === newClass)\n''',
              '''  const selectedAlreadyAdded =\n    newClass !== "" &&\n    String(newClass) !== String(CUSTOM_CLASS_RUNTIME_ID) &&\n    classPlans.some((plan) => plan.className === newClass)\n''',
              'allow repeated custom selection',
          )
          text = replace_once(
              text,
              '''                const added = classPlans.some(\n                  (plan) => plan.className === className,\n                )\n                const label =\n                  String(className) === String(CUSTOM_CLASS_RUNTIME_ID)\n                    ? customClassName.trim() || "Classe personalizada"\n                    : getClassNamePt(className)\n''',
              '''                const customOption =\n                  String(className) === String(CUSTOM_CLASS_RUNTIME_ID)\n                const added =\n                  !customOption &&\n                  classPlans.some((plan) => plan.className === className)\n                const label = customOption\n                  ? "Classe personalizada"\n                  : getClassNamePt(className)\n''',
              'custom dropdown remains reusable',
          )
          text = replace_once(
              text,
              '''        const isCustomClass =\n          String(plan.className) === String(CUSTOM_CLASS_RUNTIME_ID)\n        const displayLabel = isCustomClass\n          ? customClassName.trim() || progression.label\n          : progression.label\n''',
              '''        const isCustomClass = isCustomClassName(plan.className)\n        const customClassConfig = customClassConfigs?.[String(plan.className)]\n        const displayLabel = isCustomClass\n          ? customClassConfig?.name.trim() ||\n            customClassName.trim() ||\n            progression.label\n          : progression.label\n''',
              'custom card label/config',
          )
          text = replace_once(
              text,
              '''                    <CustomClassConfigurationEditor\n                      config={customClassConfig}\n                      applyLabel="Aplicar ao rascunho"\n                      onApply={onApplyCustomClassConfig}\n                    />''',
              '''                    <CustomClassConfigurationEditor\n                      config={customClassConfig}\n                      applyLabel="Aplicar ao rascunho"\n                      onApply={(next) =>\n                        onApplyCustomClassConfig(plan.className, next)\n                      }\n                    />''',
              'custom card applies own config',
          )
          # ReviewStep accepts config map and labels each generated custom id.
          text = replace_once(
              text,
              '''  classPlans,\n  customClassName,\n  classEquipmentItems,''',
              '''  classPlans,\n  customClassName,\n  customClassConfigs,\n  classEquipmentItems,''',
              'review custom map destructure',
          )
          text = replace_once(
              text,
              '''  classPlans: ProgressionClassPlan[]\n  customClassName: string\n  classEquipmentItems: Itemmable[]''',
              '''  classPlans: ProgressionClassPlan[]\n  customClassName: string\n  customClassConfigs?: Record<string, CustomClassRuntimeConfig>\n  classEquipmentItems: Itemmable[]''',
              'review custom map type',
          )
          text = replace_once(
              text,
              '''                {String(plan.className) === String(CUSTOM_CLASS_RUNTIME_ID)\n                  ? customClassName.trim() || "Classe personalizada"\n                  : getClassNamePt(plan.className)}{" "}\n''',
              '''                {isCustomClassName(plan.className)\n                  ? customClassConfigs?.[String(plan.className)]?.name.trim() ||\n                    customClassName.trim() ||\n                    "Classe personalizada"\n                  : getClassNamePt(plan.className)}{" "}\n''',
              'review per-custom label',
          )
          text = replace_once(
              text,
              '  if (String(className) === String(CUSTOM_CLASS_RUNTIME_ID)) return []\n',
              '  if (isCustomClassName(className)) return []\n',
              'custom starting equipment predicate',
          )
          path.write_text(text)

          # Sanity checks: the old single-config prop/state must be gone from creation.
          wrapper = Path('src/features/characters/creation/characterCreationWizard.tsx').read_text()
          integrated = Path('src/features/characters/creation/IntegratedCharacterCreationWizard.tsx').read_text()
          if 'const [customClassConfig, setCustomClassConfig]' in wrapper:
              raise SystemExit('legacy single custom class state remains')
          if 'customClassConfig?: CustomClassRuntimeConfig' in integrated:
              raise SystemExit('legacy single custom class prop remains')
          if 'customClassConfig={customClassConfig}' in integrated:
              raise SystemExit('legacy single custom config render remains')
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Verify touched code
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'src/(models/characters/customClass(Config|Progression)\.ts|models/leveling/(SpellSelectionRules|ClassProficiencyRules|ClassLocalization)\.ts|data/classProgression/registry\.ts|features/characters/creation/(characterCreationWizard|IntegratedCharacterCreationWizard)\.tsx)' /tmp/build.log; then
            echo "Multiple custom class changes introduced TypeScript/build errors."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Full build still contains unrelated baseline errors; touched files are clean."
          fi

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-multiple-custom-classes.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: allow multiple custom classes"
          git push origin HEAD:feature/session-server
