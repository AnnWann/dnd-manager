name: Run race creation fix

on:
  pull_request:
    branches:
      - feature/auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth
          fetch-depth: 0

      - name: Apply embedded patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-race-creation-fixes.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow:
              raise RuntimeError('Embedded patch start marker not found')
          embedded = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          embedded = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          exec(embedded, {'__name__': '__main__'})
          PY

          rm -f .github/workflows/run-race-creation-fix-pr.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/characters/creation .github/workflows
          git diff --cached --check
          git commit -m "Fix racial presets and custom race editing"
          git push origin HEAD:feature/auth
