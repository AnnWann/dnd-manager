name: Inherit custom slot progression

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/inherit-custom-slot-progression.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply inherited progression behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}\n{old[:300]}')
              path.write_text(text.replace(old, new, 1))

          # Shared sparse-progression resolver. A cell only overrides that circle
          # from its class level onward; later explicit cells can override it again.
          path = Path('src/models/characters/customClassConfig.ts')
          text = path.read_text()
          marker = '''export function getCustomCantripsKnownAtLevel(\n'''
          helper = '''export function getCustomProgressionValueAtLevel(\n  progression: Record<string, Record<string, number>>,\n  classLevel: number,\n  circle: number,\n): number {\n  const targetLevel = Math.max(1, Math.min(20, Math.trunc(classLevel || 1)))\n  const circleKey = String(Math.max(1, Math.min(9, Math.trunc(circle || 1))))\n  let amount = 0\n\n  for (let level = 1; level <= targetLevel; level += 1) {\n    const configured = progression[String(level)]?.[circleKey]\n    if (configured === undefined) continue\n    amount = Math.max(0, Math.trunc(Number(configured) || 0))\n  }\n\n  return amount\n}\n\n'''
          if 'export function getCustomProgressionValueAtLevel(' not in text:
              if marker not in text:
                  raise SystemExit('customClassConfig helper marker missing')
              path.write_text(text.replace(marker, helper + marker, 1))

          replace_once(path,
          '''      const row = pool.progression[level] ?? {}\n      for (let circle = 1; circle <= 9; circle += 1) {\n        const key = String(circle)\n        const max = Math.max(0, Math.trunc(Number(row[key] ?? 0)))\n''',
          '''      for (let circle = 1; circle <= 9; circle += 1) {\n        const key = String(circle)\n        const max = getCustomProgressionValueAtLevel(\n          pool.progression,\n          classEntry.level,\n          circle,\n        )\n''')

          replace_once(path,
          '''    const key = String(level)\n    const row = pool.progression[String(classEntry.level)] ?? {}\n    const max = Math.max(0, Math.trunc(Number(row[key] ?? 0)))\n''',
          '''    const key = String(level)\n    const max = getCustomProgressionValueAtLevel(\n      pool.progression,\n      classEntry.level,\n      level,\n    )\n''')

          # Main explicit spell-slot table uses the same inheritance semantics.
          path = Path('src/models/magic/spells/SpellSlotProgression.ts')
          replace_once(path,
          '''import {\n  getCustomClassConfigFromEntry,\n  isCustomClassEntry,\n} from "../../characters/customClassConfig"\n''',
          '''import {\n  getCustomClassConfigFromEntry,\n  getCustomProgressionValueAtLevel,\n  isCustomClassEntry,\n} from "../../characters/customClassConfig"\n''')

          replace_once(path,
          '''  const row = config.spellSlotProgression[String(classData.level)] ?? {}\n  const result: Partial<Record<MagicCircleLevel, number>> = {}\n\n  for (let level = 1; level <= 9; level += 1) {\n    const circle = level as MagicCircleLevel\n    const amount = Math.max(0, Math.trunc(Number(row[String(level)] ?? 0)))\n''',
          '''  const result: Partial<Record<MagicCircleLevel, number>> = {}\n\n  for (let level = 1; level <= 9; level += 1) {\n    const circle = level as MagicCircleLevel\n    const amount = getCustomProgressionValueAtLevel(\n      config.spellSlotProgression,\n      classData.level,\n      level,\n    )\n''')

          # Editor shows inherited values, but stores only explicit overrides.
          # Clearing an override falls back to the previous level; entering 0 is
          # an explicit override to zero (important for Warlock-like tables).
          path = Path('src/features/characters/characterSheet/classes/CustomClassConfigurationTab.tsx')
          replace_once(path,
          '''  createCustomSlotPool,\n  getCustomClassConfig,\n  normalizeCustomClassConfig,\n''',
          '''  createCustomSlotPool,\n  getCustomClassConfig,\n  getCustomProgressionValueAtLevel,\n  normalizeCustomClassConfig,\n''')

          replace_once(path,
          '''  function setProgressionCell(\n    progression: Record<string, Record<string, number>>,\n    level: number,\n    circle: number,\n    amount: number,\n  ) {\n    const next = { ...progression }\n    const levelKey = String(level)\n    const circleKey = String(circle)\n    const row = { ...(next[levelKey] ?? {}) }\n\n    if (amount > 0) row[circleKey] = amount\n    else delete row[circleKey]\n''',
          '''  function setProgressionCell(\n    progression: Record<string, Record<string, number>>,\n    level: number,\n    circle: number,\n    raw: string,\n  ) {\n    const next = { ...progression }\n    const levelKey = String(level)\n    const circleKey = String(circle)\n    const row = { ...(next[levelKey] ?? {}) }\n\n    if (raw.trim() === "") delete row[circleKey]\n    else row[circleKey] = Math.max(0, Math.trunc(Number(raw) || 0))\n''')

          replace_once(path,
          '''                              value={draft.spellSlotProgression[String(level)]?.[String(circle)] ?? ""}\n                              placeholder="—"\n                              onChange={(event) => {\n                                const amount = Math.max(0, Math.trunc(Number(event.target.value) || 0))\n                                patch({\n                                  spellSlotProgression: setProgressionCell(\n                                    draft.spellSlotProgression,\n                                    level,\n                                    circle,\n                                    amount,\n                                  ),\n                                })\n                              }}\n''',
          '''                              value={\n                                draft.spellSlotProgression[String(level)]?.[String(circle)] ??\n                                (getCustomProgressionValueAtLevel(\n                                  draft.spellSlotProgression,\n                                  level,\n                                  circle,\n                                ) || "")\n                              }\n                              placeholder="—"\n                              onChange={(event) => {\n                                patch({\n                                  spellSlotProgression: setProgressionCell(\n                                    draft.spellSlotProgression,\n                                    level,\n                                    circle,\n                                    event.target.value,\n                                  ),\n                                })\n                              }}\n''')

          replace_once(path,
          '''                              value={pool.progression[String(level)]?.[String(circle)] ?? ""}\n                              placeholder="—"\n                              onChange={(event) => {\n                                const amount = Math.max(0, Math.trunc(Number(event.target.value) || 0))\n                                const pools = [...draft.additionalSlotPools]\n                                pools[poolIndex] = {\n                                  ...pool,\n                                  progression: setProgressionCell(pool.progression, level, circle, amount),\n                                }\n''',
          '''                              value={\n                                pool.progression[String(level)]?.[String(circle)] ??\n                                (getCustomProgressionValueAtLevel(\n                                  pool.progression,\n                                  level,\n                                  circle,\n                                ) || "")\n                              }\n                              placeholder="—"\n                              onChange={(event) => {\n                                const pools = [...draft.additionalSlotPools]\n                                pools[poolIndex] = {\n                                  ...pool,\n                                  progression: setProgressionCell(\n                                    pool.progression,\n                                    level,\n                                    circle,\n                                    event.target.value,\n                                  ),\n                                }\n''')

          path.write_text(path.read_text().replace(
              'Use a progressão automática de conjurador ou defina exatamente quantos espaços de cada círculo a classe possui em cada nível.',
              'Use a progressão automática de conjurador ou defina os espaços manualmente. Valores continuam nos níveis seguintes até que você informe outro valor; um valor alterado abaixo vira uma substituição independente.',
              1,
          ))
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/inherit-custom-slot-progression.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: inherit custom slot progression values"
          git push origin HEAD:feature/session-server
