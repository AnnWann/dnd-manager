name: Fix custom class editor draft reset

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/fix-custom-class-editor-reset.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/characters/characterSheet/classes/CustomClassConfigurationTab.tsx')
          text = path.read_text()

          old_import = 'import { useEffect, useMemo, useState } from "react"'
          new_import = 'import { useEffect, useMemo, useRef, useState } from "react"'
          if text.count(old_import) != 1:
              raise SystemExit(f'import anchor mismatch: {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old = '''  const normalizedConfig = useMemo(() => normalizeCustomClassConfig(config), [config])
  const [draft, setDraft] = useState<CustomClassRuntimeConfig>(normalizedConfig)
  const [applying, setApplying] = useState(false)

  useEffect(() => {
    setDraft(normalizedConfig)
  }, [normalizedConfig])
'''
          new = '''  const normalizedConfig = useMemo(() => normalizeCustomClassConfig(config), [config])
  const normalizedConfigSignature = JSON.stringify(normalizedConfig)
  const lastConfigSignatureRef = useRef(normalizedConfigSignature)
  const [draft, setDraft] = useState<CustomClassRuntimeConfig>(normalizedConfig)
  const [applying, setApplying] = useState(false)

  useEffect(() => {
    if (lastConfigSignatureRef.current === normalizedConfigSignature) return
    lastConfigSignatureRef.current = normalizedConfigSignature
    setDraft(normalizedConfig)
  }, [normalizedConfig, normalizedConfigSignature])
'''
          if text.count(old) != 1:
              raise SystemExit(f'editor sync anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Verify touched code
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -F 'src/features/characters/characterSheet/classes/CustomClassConfigurationTab.tsx' /tmp/build.log; then
            echo "Custom class editor fix introduced a TypeScript/build error."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Full build still contains unrelated baseline errors; touched file is clean."
          fi

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/fix-custom-class-editor-reset.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep custom class editor draft while typing"
          git push origin HEAD:feature/session-server
