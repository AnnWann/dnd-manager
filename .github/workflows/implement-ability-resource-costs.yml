name: Implement normal ability resource costs

on:
  push:
    branches:
      - qa
    paths:
      - ".github/workflows/implement-ability-resource-costs.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qa
        uses: actions/checkout@v4
        with:
          ref: qa

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply implementation
        run: python3 scripts/implement-ability-resource-costs.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Install session-server dependencies
        run: npm --prefix session-server ci

      - name: Check shared Select boundary
        run: npm run check:native-selects

      - name: Typecheck frontend
        run: npx tsc -b --pretty false

      - name: Typecheck session server
        run: npm --prefix session-server run typecheck

      - name: Build frontend
        run: npx vite build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src session-server
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: add resource costs to normal abilities"
          git push origin HEAD:qa
