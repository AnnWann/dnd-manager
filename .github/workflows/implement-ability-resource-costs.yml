name: Implement normal ability resource costs

on:
  push:
    branches:
      - qa
    paths:
      - ".github/workflows/implement-ability-resource-costs.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout qa
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply refinement
        run: python3 scripts/implement-ability-resource-costs.py

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install session-server dependencies
        run: npm --prefix session-server install --no-audit --no-fund

      - name: Check shared Select boundary
        run: npm run check:native-selects

      - name: Typecheck frontend
        run: npx tsc -b --pretty false

      - name: Typecheck session server
        run: npm --prefix session-server run typecheck

      - name: Build frontend
        run: npx vite build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=cfe8de69ccf1ad468a5fecacd58bfbcf6167a7a5 -- session-server/package-lock.json session-server/worker-configuration.d.ts
          git add src session-server
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: complete resource costs for normal abilities"
          git push origin HEAD:qa
