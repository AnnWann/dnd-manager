name: Apply custom class level up alignment

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/apply-custom-level-up.yml
      - scripts/apply-custom-level-up-patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dnd_manager
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dnd_manager
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation
        run: python scripts/apply-custom-level-up-patch.py

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-custom-level-up-patch.py
          rm -f .github/workflows/align-custom-level-up.yml
          rm -f .github/workflows/apply-custom-level-up.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: align custom classes in level up"
          git push origin HEAD:feature/session-server
