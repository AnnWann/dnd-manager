name: Fix ability score creation update loop

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/fix-ability-score-update-loop.yml

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix callback lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/characters/creation/CharacterCreationAbilityScoreRules.tsx')
          text = path.read_text()

          old_import = 'import { useEffect, useMemo, useState } from "react"\n'
          new_import = 'import { useEffect, useMemo, useRef, useState } from "react"\n'
          if text.count(old_import) != 1:
              raise SystemExit('unexpected React import anchor count')
          text = text.replace(old_import, new_import, 1)

          old_start = '''export function CharacterCreationAbilityScoreRules({\n  draftId,\n  onChange,\n}: Props) {\n  const initialDraft = useMemo(\n'''
          new_start = '''export function CharacterCreationAbilityScoreRules({\n  draftId,\n  onChange,\n}: Props) {\n  const onChangeRef = useRef(onChange)\n  onChangeRef.current = onChange\n\n  const initialDraft = useMemo(\n'''
          if text.count(old_start) != 1:
              raise SystemExit('unexpected component start anchor count')
          text = text.replace(old_start, new_start, 1)

          old_effect = '''  useEffect(() => {\n    onChange({ attributes, racialBonuses })\n    return () => onChange(null)\n  }, [attributes, onChange, racialBonuses])\n'''
          new_effect = '''  useEffect(() => {\n    onChangeRef.current({ attributes, racialBonuses })\n  }, [attributes, racialBonuses])\n\n  useEffect(() => {\n    return () => onChangeRef.current(null)\n  }, [])\n'''
          if text.count(old_effect) != 1:
              raise SystemExit('unexpected onChange effect anchor count')
          text = text.replace(old_effect, new_effect, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/fix-ability-score-update-loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: prevent character creation update loop"
          git push origin HEAD:feature/session-server
