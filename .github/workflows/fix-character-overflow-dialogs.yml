name: Fix character overflow and mobile dialogs

on:
  pull_request:
    paths:
      - ".github/character-layout-fix-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix character tab sizing and dialog positioning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          character_path = Path("src/views/CharacterView.tsx")
          character = character_path.read_text()
          character = character.replace(
              "setTabPanelMinHeight((current) => Math.max(current, nextHeight))",
              "setTabPanelMinHeight(nextHeight)",
              1,
          )
          character = character.replace(
              "transform: `translate3d(${swipeOffset}px, 0, 0) scale(${1 - swipeProgress * 0.015})`,",
              "transform: swipeOffset === 0\n      ? undefined\n      : `translate3d(${swipeOffset}px, 0, 0) scale(${1 - swipeProgress * 0.015})`,",
              1,
          )
          character = character.replace(
              'className="grid min-w-0 gap-4 will-change-transform"',
              'className="grid min-w-0 gap-4"',
              1,
          )
          if "Math.max(current, nextHeight)" in character:
              raise SystemExit("tab height accumulation was not removed")
          if "will-change-transform" in character:
              raise SystemExit("permanent transform containing block was not removed")
          character_path.write_text(character)

          ability_path = Path("src/features/characters/abilities/abilityDialog.tsx")
          ability = ability_path.read_text()
          ability = ability.replace(
              'className="fixed inset-0 z-[12000] flex h-screen w-screen items-start justify-center overflow-y-auto bg-black/55 p-4 pt-10 backdrop-blur-sm"',
              'className="fixed inset-0 z-[12000] flex h-screen w-screen items-center justify-center overflow-hidden bg-black/55 p-3 backdrop-blur-sm sm:p-4"',
              1,
          )
          ability = ability.replace(
              '<div className="w-full max-w-2xl rounded-xl border border-border bg-bg-elevated p-4 shadow-theme-lg">',
              '<div role="dialog" aria-modal="true" aria-label={ability ? "Editar habilidade" : "Adicionar habilidade"} className="max-h-[calc(100dvh-1.5rem)] w-full max-w-2xl overflow-y-auto overscroll-contain rounded-2xl border border-border bg-bg-elevated p-4 shadow-theme-lg sm:max-h-[calc(100dvh-2rem)]">',
              1,
          )
          ability_path.write_text(ability)

          equipment_path = Path("src/features/characters/equipment/equipmentEditDialog.tsx")
          equipment = equipment_path.read_text()
          equipment = equipment.replace(
              'className="fixed inset-0 z-[9999] flex h-screen w-screen items-start justify-center overflow-y-auto bg-black/40 p-4 pt-10"',
              'className="fixed inset-0 z-[9999] flex h-screen w-screen items-center justify-center overflow-hidden bg-black/40 p-3 sm:p-4"',
              1,
          )
          equipment = equipment.replace(
              'className="w-full max-w-2xl rounded-lg border border-border p-4 shadow-xl"',
              'role="dialog"\n        aria-modal="true"\n        aria-label="Editar equipamento"\n        className="max-h-[calc(100dvh-1.5rem)] w-full max-w-2xl overflow-y-auto overscroll-contain rounded-2xl border border-border p-4 shadow-xl sm:max-h-[calc(100dvh-2rem)]"',
              1,
          )
          equipment_path.write_text(equipment)

          settings_path = Path("src/features/characters/settings/CharacterSettingsModal.tsx")
          settings = settings_path.read_text()
          settings = settings.replace(
              'className="fixed inset-0 z-[10000] flex items-start justify-center overflow-y-auto bg-black/65 p-2 pt-3 backdrop-blur-sm sm:items-center sm:p-4"',
              'className="fixed inset-0 z-[10000] flex h-screen w-screen items-center justify-center overflow-hidden bg-black/65 p-3 backdrop-blur-sm sm:p-4"',
              1,
          )
          settings = settings.replace(
              'className="grid max-h-[calc(100dvh-1.5rem)] w-full max-w-5xl gap-5 overflow-y-auto rounded-xl border border-border bg-bg-elevated p-4 shadow-theme-lg sm:max-h-[calc(100dvh-2rem)] sm:p-5"',
              'className="grid max-h-[calc(100dvh-1.5rem)] w-full max-w-5xl gap-5 overflow-y-auto overscroll-contain rounded-2xl border border-border bg-bg-elevated p-4 shadow-theme-lg sm:max-h-[calc(100dvh-2rem)] sm:p-5"',
              1,
          )
          settings_path.write_text(settings)
          PY

          rm -f .github/character-layout-fix-trigger

      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run build

      - name: Commit correction to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/CharacterView.tsx src/features/characters/abilities/abilityDialog.tsx src/features/characters/equipment/equipmentEditDialog.tsx src/features/characters/settings/CharacterSettingsModal.tsx .github/character-layout-fix-trigger
          git commit -m "fix character overflow and centre mobile dialogs"
          git push origin HEAD:${{ github.head_ref }}
