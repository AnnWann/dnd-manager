name: Extend custom class progression configuration

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/extend-custom-class-progression.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extend custom class progression configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}\nANCHOR:\n{old[:300]}')
              path.write_text(text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # Runtime custom-class configuration
          # ------------------------------------------------------------------
          path = Path('src/models/characters/customClassConfig.ts')
          replace_once(path,
          '''  knownAtLevel1: number
  knownPerLevel: number
  slotProgressionMode: CustomSpellProgressionMode
''',
          '''  knownAtLevel1: number
  knownPerLevel: number
  cantripsKnownProgression: Record<string, number>
  asiLevels: number[]
  slotProgressionMode: CustomSpellProgressionMode
''')

          replace_once(path,
          '''  knownAtLevel1: 2,
  knownPerLevel: 1,
  slotProgressionMode: "formula",
''',
          '''  knownAtLevel1: 2,
  knownPerLevel: 1,
  cantripsKnownProgression: {},
  asiLevels: [4, 8, 12, 16, 19],
  slotProgressionMode: "formula",
''')

          replace_once(path,
          '''    knownAtLevel1: Math.max(0, Math.trunc(Number(config.knownAtLevel1) || 0)),
    knownPerLevel: Math.max(0, Number(config.knownPerLevel) || 0),
    slotProgressionMode: config.slotProgressionMode === "table" ? "table" : "formula",
''',
          '''    knownAtLevel1: Math.max(0, Math.trunc(Number(config.knownAtLevel1) || 0)),
    knownPerLevel: Math.max(0, Number(config.knownPerLevel) || 0),
    cantripsKnownProgression:
      config.cantripsKnownProgression && typeof config.cantripsKnownProgression === "object"
        ? Object.fromEntries(
            Object.entries(config.cantripsKnownProgression)
              .map(([level, amount]) => [
                String(Math.max(1, Math.min(20, Math.trunc(Number(level) || 1)))),
                Math.max(0, Math.trunc(Number(amount) || 0)),
              ])
              .filter(([, amount]) => Number(amount) >= 0),
          )
        : {},
    asiLevels: Array.from(
      new Set(
        (Array.isArray(config.asiLevels) ? config.asiLevels : [4, 8, 12, 16, 19])
          .map((level) => Math.max(1, Math.min(20, Math.trunc(Number(level) || 0))))
          .filter((level) => level >= 1 && level <= 20),
      ),
    ).sort((left, right) => left - right),
    slotProgressionMode: config.slotProgressionMode === "table" ? "table" : "formula",
''')

          # Add helper after normalize function. This helper treats sparse values as
          # "keep the previous total", making the progression practical to author.
          text = path.read_text()
          append = '''\n\nexport function getCustomCantripsKnownAtLevel(\n  config: CustomClassRuntimeConfig,\n  classLevel: number,\n): number {\n  const target = Math.max(1, Math.min(20, Math.trunc(classLevel || 1)))\n  let amount = 0\n  for (let level = 1; level <= target; level += 1) {\n    const configured = config.cantripsKnownProgression[String(level)]\n    if (configured === undefined) continue\n    amount = Math.max(0, Math.trunc(Number(configured) || 0))\n  }\n  return amount\n}\n'''
          if 'export function getCustomCantripsKnownAtLevel(' not in text:
              path.write_text(text.rstrip() + append)

          # ------------------------------------------------------------------
          # Spell selection rules: custom classes now expose their configured
          # cantrip progression and can be cantrip-only at a given level.
          # ------------------------------------------------------------------
          path = Path('src/models/leveling/SpellSelectionRules.ts')
          replace_once(path,
          '''  createCustomClassEntry,
  getCustomClassConfigFromEntry,
''',
          '''  createCustomClassEntry,
  getCustomCantripsKnownAtLevel,
  getCustomClassConfigFromEntry,
''')

          replace_once(path,
          '''  const maxLeveledSpells =
    config.knownSpellMode === "prepared-only"
      ? 0
      : Math.max(
          0,
          Math.floor(
            config.knownAtLevel1 +
              Math.max(0, level - 1) * config.knownPerLevel,
          ),
        )

  return {
''',
          '''  const maxLeveledSpells =
    config.knownSpellMode === "prepared-only"
      ? 0
      : Math.max(
          0,
          Math.floor(
            config.knownAtLevel1 +
              Math.max(0, level - 1) * config.knownPerLevel,
          ),
        )
  const maxCantrips = getCustomCantripsKnownAtLevel(config, level)

  return {
''')

          replace_once(path,
          '''    mode: maxSpellLevel === 0 ? "none" : mode,
    castingAttribute: config.castingAttribute,
    maxSpellLevel,
    maxCantrips: 0,
''',
          '''    mode: maxSpellLevel === 0 && maxCantrips === 0 ? "none" : mode,
    castingAttribute: config.castingAttribute,
    maxSpellLevel,
    maxCantrips,
''')

          # ------------------------------------------------------------------
          # Custom class configuration UI: cantrip progression + ASI levels.
          # ------------------------------------------------------------------
          path = Path('src/features/characters/characterSheet/classes/CustomClassConfigurationTab.tsx')
          replace_once(path,
          '''  function toggleSavingThrow(attribute: Attribute) {
    if (readOnly) return
    patch({
      savingThrows: draft.savingThrows.includes(attribute)
        ? draft.savingThrows.filter((entry) => entry !== attribute)
        : [...draft.savingThrows, attribute],
    })
  }

  function setProgressionCell(
''',
          '''  function toggleSavingThrow(attribute: Attribute) {
    if (readOnly) return
    patch({
      savingThrows: draft.savingThrows.includes(attribute)
        ? draft.savingThrows.filter((entry) => entry !== attribute)
        : [...draft.savingThrows, attribute],
    })
  }

  function toggleAsiLevel(level: number) {
    if (readOnly) return
    patch({
      asiLevels: draft.asiLevels.includes(level)
        ? draft.asiLevels.filter((entry) => entry !== level)
        : [...draft.asiLevels, level].sort((left, right) => left - right),
    })
  }

  function setCantripsAtLevel(level: number, raw: string) {
    if (readOnly) return
    const progression = { ...draft.cantripsKnownProgression }
    if (raw.trim() === "") delete progression[String(level)]
    else progression[String(level)] = Math.max(0, Math.trunc(Number(raw) || 0))
    patch({ cantripsKnownProgression: progression })
  }

  function setProgressionCell(
''')

          replace_once(path,
          '''        <div className="mt-5 rounded-xl border border-border bg-bg-subtle p-3">
          <div className="text-xs font-semibold text-textH">
            Proficiências em testes de resistência
          </div>
''',
          '''        <div className="mt-5 rounded-xl border border-border bg-bg-subtle p-3">
          <div className="text-xs font-semibold text-textH">Níveis de ASI / talentos</div>
          <p className="mt-1 text-xs leading-5 text-textMuted">
            Marque os níveis da classe em que o personagem recebe um aumento de atributo ou talento.
          </p>
          <div className="mt-2 grid grid-cols-5 gap-2 sm:grid-cols-10">
            {LEVELS.map((level) => {
              const selected = draft.asiLevels.includes(level)
              return (
                <button
                  key={level}
                  type="button"
                  disabled={readOnly}
                  aria-pressed={selected}
                  onClick={() => toggleAsiLevel(level)}
                  className={[
                    "rounded-lg border px-2 py-2 text-xs font-semibold disabled:cursor-default disabled:opacity-70",
                    selected
                      ? "border-accentBorder bg-accentBg text-textH"
                      : "border-border bg-bg text-textMuted",
                  ].join(" ")}
                >
                  {selected ? "✓ " : ""}{level}
                </button>
              )
            })}
          </div>
        </div>

        <div className="mt-5 rounded-xl border border-border bg-bg-subtle p-3">
          <div className="text-xs font-semibold text-textH">
            Proficiências em testes de resistência
          </div>
''')

          replace_once(path,
          '''      {draft.casterType !== "none" ? (
        <section className="rounded-xl border border-border bg-bg p-4 shadow-theme-sm">
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 className="text-sm font-semibold text-textH">Progressão de espaços de magia</h2>
''',
          '''      {draft.casterType !== "none" ? (
        <>
          <section className="rounded-xl border border-border bg-bg p-4 shadow-theme-sm">
            <div>
              <h2 className="text-sm font-semibold text-textH">Progressão de truques conhecidos</h2>
              <p className="mt-1 max-w-3xl text-xs leading-5 text-textMuted">
                Informe o total de truques conhecidos nos níveis em que esse total muda. Campos vazios mantêm o valor do nível anterior.
              </p>
            </div>
            <div className="mt-3 grid grid-cols-4 gap-2 sm:grid-cols-5 lg:grid-cols-10">
              {LEVELS.map((level) => (
                <label key={level} className="grid gap-1">
                  <span className="text-[11px] text-textMuted">N{level}</span>
                  <input
                    disabled={readOnly}
                    type="number"
                    min={0}
                    max={20}
                    inputMode="numeric"
                    className="h-9 w-full rounded-md border border-border bg-bg-subtle px-2 text-center text-xs text-textH disabled:opacity-70"
                    value={draft.cantripsKnownProgression[String(level)] ?? ""}
                    placeholder="—"
                    onChange={(event) => setCantripsAtLevel(level, event.target.value)}
                  />
                </label>
              ))}
            </div>
          </section>

          <section className="rounded-xl border border-border bg-bg p-4 shadow-theme-sm">
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 className="text-sm font-semibold text-textH">Progressão de espaços de magia</h2>
''')

          replace_once(path,
          '''        </section>
      ) : null}

      <section className="rounded-xl border border-border bg-bg p-4 shadow-theme-sm">
''',
          '''          </section>
        </>
      ) : null}

      <section className="rounded-xl border border-border bg-bg p-4 shadow-theme-sm">
''')

          # ------------------------------------------------------------------
          # Creation bridge receives the actual custom runtime configs and uses
          # them in its preview character. This is what makes the action cards
          # react to custom spell/cantrip/ASI settings.
          # ------------------------------------------------------------------
          path = Path('src/features/characters/creation/bridges/CreationProgressionConfigurationBridge.tsx')
          replace_once(path,
          '''import type { CharacterAsi } from "../../../../models/characters/CharacterAsi"
import type { Attribute } from "../../../../models/sheet/Attribute"
''',
          '''import type { CharacterAsi } from "../../../../models/characters/CharacterAsi"
import {
  getCustomClassConfig,
  isCustomClassName,
  updateCustomClassConfig,
  type CustomClassRuntimeConfig,
} from "../../../../models/characters/customClassConfig"
import type { Attribute } from "../../../../models/sheet/Attribute"
''')

          replace_once(path,
          '''type Props = {
  open: boolean
  value: CreationProgressionConfiguration
  onChange: (value: CreationProgressionConfiguration) => void
}
''',
          '''type Props = {
  open: boolean
  value: CreationProgressionConfiguration
  customClassConfigs?: Record<string, CustomClassRuntimeConfig>
  onChange: (value: CreationProgressionConfiguration) => void
}
''')

          replace_once(path,
          '''export function CreationProgressionConfigurationBridge({
  open,
  value,
  onChange,
}: Props) {
''',
          '''export function CreationProgressionConfigurationBridge({
  open,
  value,
  customClassConfigs = {},
  onChange,
}: Props) {
''')

          replace_once(path,
          '''  const previewCharacter = useMemo(() => {
    const owner = { id: "creation-preview", name: "Criação", role: "player" as const }
    const base = newCharacterTemplate("Rascunho", owner)
    return base.withSheet(
      "classes",
      classMounts.map((entry) => createClassEntry(entry.className, entry.level)),
    )
  }, [classSignature])
''',
          '''  const previewCharacter = useMemo(() => {
    const owner = { id: "creation-preview", name: "Criação", role: "player" as const }
    const base = newCharacterTemplate("Rascunho", owner).withSheet(
      "classes",
      classMounts.map((entry) => createClassEntry(entry.className, entry.level)),
    )
    return classMounts.reduce((current, entry) => {
      if (!isCustomClassName(entry.className)) return current
      const config = customClassConfigs[String(entry.className)]
      return config
        ? updateCustomClassConfig(current, config, entry.className)
        : current
    }, base)
  }, [classSignature, customClassConfigs])
''')

          replace_once(path,
          '''  const asiLevels = Array.from({ length: level }, (_, index) => index + 1).filter(
    (candidate) => isAsiLevel(className, candidate),
  )
''',
          '''  const customClassConfig = isCustomClassName(className)
    ? getCustomClassConfig(character, className)
    : undefined
  const asiLevels = Array.from({ length: level }, (_, index) => index + 1).filter(
    (candidate) =>
      customClassConfig
        ? customClassConfig.asiLevels.includes(candidate)
        : isAsiLevel(className, candidate),
  )
''')

          # ------------------------------------------------------------------
          # Feed the bridge the wrapper-owned custom class configs.
          # ------------------------------------------------------------------
          path = Path('src/features/characters/creation/characterCreationWizard.tsx')
          replace_once(path,
          '''      <CreationProgressionConfigurationBridge
        open={props.open}
        value={progressionConfiguration}
        onChange={updateProgressionConfiguration}
      />
''',
          '''      <CreationProgressionConfigurationBridge
        open={props.open}
        value={progressionConfiguration}
        customClassConfigs={customClassConfigs}
        onChange={updateProgressionConfiguration}
      />
''')
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/extend-custom-class-progression.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: configure custom class spell and ASI progression"
          git push origin HEAD:feature/session-server
