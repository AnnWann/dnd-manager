name: Extend custom class progression configuration

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/extend-custom-class-progression.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply implementation patch
        run: git apply --whitespace=fix .github/patches/custom-class-progression.patch

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/extend-custom-class-progression.yml
          rm -f .github/patches/custom-class-progression.patch
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: configure custom class spell and ASI progression"
          git push origin HEAD:feature/session-server
