name: Apply unified item destinations

on:
  pull_request:
    paths:
      - ".github/unified-item-destinations-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply unified item destination updates
        run: python .github/apply_unified_item_destinations.py

      - name: Preserve pocketability helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/characters/inventory/inventoryEditorV2.tsx')
          text = path.read_text()
          anchor = 'import {\n  getDefaultPocketableForKind,'
          if anchor in text:
              text = text.replace(
                  anchor,
                  'import {\n  canItemGoInPocket,\n  getDefaultPocketableForKind,',
                  1,
              )
          path.write_text(text)
          PY

      - name: Remove temporary implementation files
        run: rm -f .github/unified-item-destinations-trigger .github/apply_unified_item_destinations.py

      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run build

      - name: Commit implementation to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unify inventory pocket and ground destinations"
          git push origin HEAD:${{ github.head_ref }}
