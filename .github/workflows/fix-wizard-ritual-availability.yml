name: Fix wizard ritual availability

on:
  pull_request:
    paths:
      - ".github/ritual-fix-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restrict unprepared ritual availability to wizards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          known_path = Path("src/features/characters/magic/knownSpellsList.tsx")
          known = known_path.read_text()

          if "const availableAsRitual = canCastAsRitual(" not in known:
              old = "    const availableAsRitual = spell.ritual\n"
              new = (
                  "    const availableAsRitual = canCastAsRitual(\n"
                  "      spell,\n"
                  "      entry.source,\n"
                  "      prepared,\n"
                  "      classes,\n"
                  "    )\n"
              )
              if old not in known:
                  raise SystemExit("ritual availability assignment not found")
              known = known.replace(old, new, 1)

          old_description = (
              "          raça e equipamentos equipados. Magias de ritual também contam como\n"
              "          disponíveis e são identificadas separadamente.\n"
          )
          if old_description in known:
              known = known.replace(
                  old_description,
                  "          raça e equipamentos equipados. Rituais preparados são identificados,\n"
                  "          e magos também podem acessar rituais não preparados do grimório.\n",
                  1,
              )

          compact_props = (
              "                    alwaysPrepared={entry.alwaysPrepared}\n"
              "                    accessLabel={entry.accessLabel}\n"
          )
          if "availableAsRitual={entry.availableAsRitual}" not in known:
              if compact_props not in known:
                  raise SystemExit("compact spell props not found")
              known = known.replace(
                  compact_props,
                  "                    alwaysPrepared={entry.alwaysPrepared}\n"
                  "                    availableAsRitual={entry.availableAsRitual}\n"
                  "                    accessLabel={entry.accessLabel}\n",
                  1,
              )

          marker = (
              "function isSpellAvailable(entry: DisplaySpellEntry): boolean {\n"
              "  return entry.prepared || entry.alwaysPrepared || entry.availableAsRitual\n"
              "}\n"
          )
          if "function canCastAsRitual(" not in known:
              helper = (
                  "function canCastAsRitual(\n"
                  "  spell: Spell,\n"
                  "  source: SpellSource,\n"
                  "  prepared: boolean,\n"
                  "  classes: CharacterClassInterface[],\n"
                  "): boolean {\n"
                  "  if (!spell.ritual) return false\n"
                  "  if (prepared) return true\n"
                  "  if (source.type !== \"class\" || source.name !== \"wizard\") return false\n"
                  "\n"
                  "  const wizardClass = classes.find((entry) => entry.className === \"wizard\")\n"
                  "  return wizardClass?.knownSpells?.mode === \"spellbook\"\n"
                  "}\n"
                  "\n"
              )
              if marker not in known:
                  raise SystemExit("isSpellAvailable marker not found")
              known = known.replace(marker, helper + marker, 1)

          known_path.write_text(known)

          compact_path = Path("src/features/characters/magic/compactSpellCard.tsx")
          compact = compact_path.read_text()

          if "  availableAsRitual: boolean\n" not in compact:
              old = "  alwaysPrepared: boolean\n  accessLabel?: string\n"
              if old not in compact:
                  raise SystemExit("compact props type not found")
              compact = compact.replace(
                  old,
                  "  alwaysPrepared: boolean\n  availableAsRitual: boolean\n  accessLabel?: string\n",
                  1,
              )

          if "  availableAsRitual,\n" not in compact:
              old = "  alwaysPrepared,\n  accessLabel,\n"
              if old not in compact:
                  raise SystemExit("compact props destructuring not found")
              compact = compact.replace(
                  old,
                  "  alwaysPrepared,\n  availableAsRitual,\n  accessLabel,\n",
                  1,
              )

          compact = compact.replace(
              "        {spell.ritual ? (\n",
              "        {availableAsRitual ? (\n",
              1,
          )
          compact_path.write_text(compact)
          PY

          rm -f .github/ritual-fix-trigger

      - run: npm ci
      - run: npm run build

      - name: Commit correction to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/characters/magic/knownSpellsList.tsx src/features/characters/magic/compactSpellCard.tsx .github/ritual-fix-trigger
          git commit -m "restrict unprepared ritual access to wizards"
          git push origin HEAD:${{ github.head_ref }}
