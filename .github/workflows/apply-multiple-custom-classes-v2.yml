name: Apply multiple custom classes v2

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/apply-multiple-custom-classes-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply corrected patch
        shell: bash
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY[[:space:]]*$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-multiple-custom-classes.yml > /tmp/apply.py
          test -s /tmp/apply.py

          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply.py')
          script = path.read_text()
          marker = "              'review per-custom label',"
          marker_index = script.find(marker)
          if marker_index < 0:
              raise SystemExit('review label patch marker not found')
          call_start = script.rfind('          text = replace_once(\n', 0, marker_index)
          call_end = script.find('          )\n', marker_index)
          if call_start < 0 or call_end < 0:
              raise SystemExit('review label patch call boundaries not found')
          call_end += len('          )\n')
          script = script[:call_start] + script[call_end:]
          path.write_text(script)
          PY

          python /tmp/apply.py

          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/characters/creation/IntegratedCharacterCreationWizard.tsx')
          text = path.read_text()
          old = 'String(plan.className) === String(CUSTOM_CLASS_RUNTIME_ID) ? customClassName.trim() || getClassNamePt(plan.className) : getClassNamePt(plan.className)'
          new = 'isCustomClassName(plan.className) ? customClassConfigs?.[String(plan.className)]?.name.trim() || customClassName.trim() || getClassNamePt(plan.className) : getClassNamePt(plan.className)'
          if text.count(old) != 1:
              raise SystemExit(f'review class label anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Verify touched code
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'src/(models/characters/customClass(Config|Progression)\.ts|models/leveling/(SpellSelectionRules|ClassProficiencyRules|ClassLocalization)\.ts|data/classProgression/registry\.ts|features/characters/creation/(characterCreationWizard|IntegratedCharacterCreationWizard)\.tsx)' /tmp/build.log; then
            echo "Multiple custom class changes introduced TypeScript/build errors."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Full build still contains unrelated baseline errors; touched files are clean."
          fi

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-multiple-custom-classes.yml
          rm -f .github/workflows/apply-multiple-custom-classes-v2.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: allow multiple custom classes"
          git push origin HEAD:feature/session-server
