name: Migrate native selects

on:
  push:
    branches:
      - qa
    paths:
      - scripts/migrate-native-selects.mjs
      - .github/workflows/migrate-native-selects.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qa
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Replace native selects with shared Select
        run: node scripts/migrate-native-selects.mjs --write

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "No select migration changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor: use shared select across application"
          git push origin HEAD:qa
