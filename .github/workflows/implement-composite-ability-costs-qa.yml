name: Implement composite ability costs on QA

on:
  push:
    branches: [qa]
    paths:
      - scripts/implement-composite-ability-costs.mjs
      - .github/workflows/implement-composite-ability-costs-qa.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply migration
        run: node scripts/implement-composite-ability-costs.mjs

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck application
        run: npx tsc -b --pretty false

      - name: Install session server dependencies
        run: npm --prefix session-server ci

      - name: Typecheck session server
        run: npm --prefix session-server run typecheck

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src session-server/src
          git diff --cached --quiet && exit 1
          git commit -m "feat: add composite custom ability costs"
          git push origin qa
