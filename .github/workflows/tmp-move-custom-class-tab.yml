name: Move custom class tab
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move tab after proficiencies
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/views/CharacterView.tsx')
          text = path.read_text()
          old = '''    const magicIndex = ordered.findIndex((entry) => entry.key === "spellsList")
    const insertionIndex = magicIndex >= 0 ? magicIndex + 1 : ordered.length
'''
          new = '''    const proficienciesIndex = ordered.findIndex((entry) => entry.key === "proficiencies")
    const insertionIndex = proficienciesIndex >= 0 ? proficienciesIndex + 1 : ordered.length
'''
          if old not in text:
            raise SystemExit('Expected tab insertion block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/CharacterView.tsx
          git commit -m "Move configuração de classe após proficiências"
          git push
