name: Apply inline class configuration

on:
  push:
    branches:
      - feature/session-server
    paths:
      - .github/workflows/apply-inline-class-configuration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply inline configuration refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          integrated_path = Path('src/features/characters/creation/IntegratedCharacterCreationWizard.tsx')
          wrapper_path = Path('src/features/characters/creation/characterCreationWizard.tsx')
          integrated = integrated_path.read_text()
          wrapper = wrapper_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          integrated = replace_once(
              integrated,
              'import { CUSTOM_CLASS_RUNTIME_ID } from "../../../models/characters/customClassConfig"\n',
              'import {\n  CUSTOM_CLASS_RUNTIME_ID,\n  type CustomClassRuntimeConfig,\n} from "../../../models/characters/customClassConfig"\n',
              'custom class config type import',
          )
          integrated = replace_once(
              integrated,
              'import { AbilityDialog } from "../abilities/abilityDialog"\n',
              'import { AbilityDialog } from "../abilities/abilityDialog"\nimport { CustomClassConfigurationEditor } from "../characterSheet/classes/CustomClassConfigurationTab"\n',
              'custom class editor import',
          )
          integrated = replace_once(
              integrated,
              '''  customClassName?: string\n  onConfigureCustomClass?: () => void\n  mode?: "modal" | "page"''',
              '''  customClassName?: string\n  customClassConfig?: CustomClassRuntimeConfig\n  onApplyCustomClassConfig?: (config: CustomClassRuntimeConfig) => void\n  mode?: "modal" | "page"''',
              'integrated custom class props',
          )
          integrated = replace_once(
              integrated,
              '''  createOwner,\n  customClassName = "Classe personalizada",\n  onConfigureCustomClass,\n  mode = "modal",''',
              '''  createOwner,\n  customClassName = "Classe personalizada",\n  customClassConfig,\n  onApplyCustomClassConfig,\n  mode = "modal",''',
              'integrated custom class destructure',
          )

          auto_open = '''      if (String(className) === String(CUSTOM_CLASS_RUNTIME_ID)) {\n        onConfigureCustomClass?.()\n      }\n'''
          if integrated.count(auto_open) != 2:
              raise SystemExit(f'custom class auto-open: expected 2 anchors, found {integrated.count(auto_open)}')
          integrated = integrated.replace(auto_open, '')

          integrated = replace_once(
              integrated,
              '''              classPlans={classPlans}\n              customClassName={customClassName}\n              blockedSkills={blockedClassSkills}''',
              '''              classPlans={classPlans}\n              customClassName={customClassName}\n              customClassConfig={customClassConfig}\n              blockedSkills={blockedClassSkills}''',
              'classes step custom config prop',
          )
          integrated = replace_once(
              integrated,
              '''              onAddClass={addClass}\n              onRemoveClass={removeClass}\n              onConfigureCustomClass={onConfigureCustomClass}\n              onShiftLevel={shiftClassLevel}''',
              '''              onAddClass={addClass}\n              onRemoveClass={removeClass}\n              onApplyCustomClassConfig={onApplyCustomClassConfig}\n              onShiftLevel={shiftClassLevel}''',
              'classes step custom apply callback',
          )

          integrated = replace_once(
              integrated,
              '''  classPlans,\n  customClassName,\n  blockedSkills,''',
              '''  classPlans,\n  customClassName,\n  customClassConfig,\n  blockedSkills,''',
              'classes step custom config destructure',
          )
          integrated = replace_once(
              integrated,
              '''  onAddClass,\n  onRemoveClass,\n  onConfigureCustomClass,\n  onShiftLevel,''',
              '''  onAddClass,\n  onRemoveClass,\n  onApplyCustomClassConfig,\n  onShiftLevel,''',
              'classes step custom callback destructure',
          )
          integrated = replace_once(
              integrated,
              '''  classPlans: ProgressionClassPlan[]\n  customClassName: string\n  blockedSkills: Set<Skill>''',
              '''  classPlans: ProgressionClassPlan[]\n  customClassName: string\n  customClassConfig?: CustomClassRuntimeConfig\n  blockedSkills: Set<Skill>''',
              'classes step custom config type',
          )
          integrated = replace_once(
              integrated,
              '''  onAddClass: (className: ClassName) => void\n  onRemoveClass: (className: ClassName) => void\n  onConfigureCustomClass?: () => void\n  onShiftLevel:''',
              '''  onAddClass: (className: ClassName) => void\n  onRemoveClass: (className: ClassName) => void\n  onApplyCustomClassConfig?: (config: CustomClassRuntimeConfig) => void\n  onShiftLevel:''',
              'classes step custom callback type',
          )
          integrated = replace_once(
              integrated,
              '''                    })\n                    if (isCustomClass) onConfigureCustomClass?.()\n                  }}''',
              '''                    })\n                  }}''',
              'configure button custom modal trigger',
          )

          expanded_anchor = '''            {expandedClasses.has(plan.className) ? (\n              <>\n\n            {subclassRequired && progression.subclasses.length ? ('''
          expanded_replacement = '''            {expandedClasses.has(plan.className) ? (\n              <>\n                {isCustomClass && customClassConfig && onApplyCustomClassConfig ? (\n                  <div className="rounded-lg border border-border bg-bg p-3">\n                    <CustomClassConfigurationEditor\n                      config={customClassConfig}\n                      applyLabel="Aplicar ao rascunho"\n                      onApply={onApplyCustomClassConfig}\n                    />\n                  </div>\n                ) : null}\n\n            {subclassRequired && progression.subclasses.length ? ('''
          integrated = replace_once(
              integrated,
              expanded_anchor,
              expanded_replacement,
              'inline custom class editor',
          )

          feature_anchor = '''            <FeatureList\n              title="Características personalizadas desta classe"'''
          metamagic_inline = '''            {plan.className === "sorcerer" && metamagicLimit > 0 ? (\n              <div className="grid gap-3 rounded-lg border border-border bg-bg p-3">\n                <div>\n                  <strong className="text-sm text-textH">Metamagia</strong>\n                  <p className="mt-1 text-xs text-textMuted">\n                    Escolha {metamagicLimit} opções para Feiticeiro {plan.level}.\n                  </p>\n                </div>\n                <div className="grid gap-3 md:grid-cols-2">\n                  {metamagics.map((metamagic) => {\n                    const selected = selectedMetamagics.includes(metamagic.id)\n                    return (\n                      <button\n                        key={metamagic.id}\n                        type="button"\n                        onClick={() => onToggleMetamagic(metamagic.id)}\n                        className={\n                          selected\n                            ? "rounded-xl border border-accentBorder bg-accentBg p-4 text-left"\n                            : "rounded-xl border border-border bg-bg-subtle p-4 text-left"\n                        }\n                      >\n                        <strong className="text-sm text-textH">{metamagic.name}</strong>\n                        <details\n                          className="mt-2 text-xs"\n                          onClick={(event) => event.stopPropagation()}\n                        >\n                          <summary className="cursor-pointer font-medium text-textH">\n                            Ler detalhes da Metamagia\n                          </summary>\n                          <p className="mt-2 leading-5 text-textMuted">\n                            {metamagic.desc.join(" ")}\n                          </p>\n                        </details>\n                      </button>\n                    )\n                  })}\n                </div>\n              </div>\n            ) : null}\n\n            <FeatureList\n              title="Características personalizadas desta classe"'''
          integrated = replace_once(
              integrated,
              feature_anchor,
              metamagic_inline,
              'inline sorcerer metamagic',
          )

          metamagic_start = integrated.find('\n      {metamagicLimit > 0 ? (\n        <StepSection\n          title="Metamagia"')
          metamagic_end_marker = '\n      ) : null}\n    </div>\n  )\n}\n\nfunction ClassSpellSelector'
          if metamagic_start < 0:
              raise SystemExit('external metamagic start not found')
          metamagic_end = integrated.find(metamagic_end_marker, metamagic_start)
          if metamagic_end < 0:
              raise SystemExit('external metamagic end not found')
          integrated = (
              integrated[:metamagic_start]
              + '\n    </div>\n  )\n}\n\nfunction ClassSpellSelector'
              + integrated[metamagic_end + len(metamagic_end_marker):]
          )

          wrapper = replace_once(
              wrapper,
              'import { Button } from "../../../components/ui/Button"\n',
              '',
              'wrapper button import',
          )
          wrapper = replace_once(
              wrapper,
              '  CUSTOM_CLASS_RUNTIME_ID,\n',
              '',
              'wrapper custom runtime import',
          )
          wrapper = replace_once(
              wrapper,
              'import { CustomClassConfigurationEditor } from "../characterSheet/classes/CustomClassConfigurationTab"\n',
              '',
              'wrapper custom class editor import',
          )
          wrapper = replace_once(
              wrapper,
              '''  "draftId" | "customClassName" | "onConfigureCustomClass"\n>''',
              '''  | "draftId"\n  | "customClassName"\n  | "customClassConfig"\n  | "onApplyCustomClassConfig"\n>''',
              'wrapper omitted integrated props',
          )
          wrapper = replace_once(
              wrapper,
              '  const [customClassDialogOpen, setCustomClassDialogOpen] = useState(false)\n',
              '',
              'custom class dialog state',
          )
          wrapper = replace_once(
              wrapper,
              '      setCustomClassDialogOpen(false)\n',
              '',
              'custom class dialog reset',
          )

          old_integrated_render = '''      <div\n        onChangeCapture={(event) => {\n          const target = event.target\n          if (\n            target instanceof HTMLSelectElement &&\n            target.value === String(CUSTOM_CLASS_RUNTIME_ID)\n          ) {\n            setCustomClassDialogOpen(true)\n          }\n        }}\n      >\n        <IntegratedCharacterCreationWizard\n          {...props}\n          draftId={draftId}\n          customClassName={customClassConfig.name}\n          onConfigureCustomClass={() => setCustomClassDialogOpen(true)}\n          onCreate={handleCreate}\n        />\n      </div>'''
          new_integrated_render = '''      <IntegratedCharacterCreationWizard\n        {...props}\n        draftId={draftId}\n        customClassName={customClassConfig.name}\n        customClassConfig={customClassConfig}\n        onApplyCustomClassConfig={(next) =>\n          setCustomClassConfig(normalizeCustomClassConfig(next))\n        }\n        onCreate={handleCreate}\n      />'''
          wrapper = replace_once(
              wrapper,
              old_integrated_render,
              new_integrated_render,
              'integrated wizard wrapper render',
          )

          dialog_render = '''\n      <CustomClassCreationDialog\n        open={customClassDialogOpen}\n        config={customClassConfig}\n        onClose={() => setCustomClassDialogOpen(false)}\n        onApply={(next) => {\n          setCustomClassConfig(normalizeCustomClassConfig(next))\n          setCustomClassDialogOpen(false)\n        }}\n      />\n'''
          wrapper = replace_once(
              wrapper,
              dialog_render,
              '\n',
              'custom class dialog render',
          )
          wrapper, count = re.subn(
              r'\nfunction CustomClassCreationDialog\([\s\S]*?\n}\n\nfunction slug',
              '\nfunction slug',
              wrapper,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'custom class dialog function: expected 1 match, found {count}')

          if 'onConfigureCustomClass' in integrated or 'customClassDialogOpen' in wrapper or 'setCustomClassDialogOpen' in wrapper:
              raise SystemExit('legacy custom class dialog references remain')

          integrated_path.write_text(integrated)
          wrapper_path.write_text(wrapper)
          PY

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Verify character creation changes
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'src/features/characters/creation/.*\.(ts|tsx)|src/features/characters/characterSheet/classes/CustomClassConfigurationTab\.tsx' /tmp/build.log; then
            echo "Class configuration files have TypeScript/build errors."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Full build still contains unrelated baseline errors; class configuration changes are clean."
          fi

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-inline-class-configuration.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: keep class configuration inside class cards"
          git push origin HEAD:feature/session-server
