name: Apply session log actor names

on:
  push:
    branches:
      - agent/session-log-actor-names
    paths:
      - .github/workflows/apply-session-log-actor-names.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-log-actor-names
          fetch-depth: 0

      - name: Apply actor name patch
        run: python .github/patch_session_log_actor_names.py

      - name: Remove temporary patch files
        run: rm .github/patch_session_log_actor_names.py .github/workflows/apply-session-log-actor-names.yml

      - name: Install frontend dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Build frontend
        run: npm run build

      - name: Install session server dependencies
        run: npm --prefix session-server install --package-lock=false --ignore-scripts

      - name: Typecheck session server
        run: npm run typecheck:session-server

      - name: Commit actor names
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show user names in session logs"
          git pull --rebase origin agent/session-log-actor-names
          git push origin HEAD:agent/session-log-actor-names
