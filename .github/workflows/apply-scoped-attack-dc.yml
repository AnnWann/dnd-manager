name: Apply scoped attack and DC bonuses

on:
  pull_request:
    paths:
      - ".github/scoped-attack-dc-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct implementation script indentation match
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_scoped_attack_dc.py')
          text = path.read_text()
          text = text.replace(
              "'               target,\\n               attribute,\\n               bonus: {'",
              "'              target,\\n              attribute,\\n              bonus: {'",
          )
          text = text.replace(
              "'               target,\\n               attribute,\\n               scopeAttribute: scopeAttribute === \\\"all\\\" ? undefined : scopeAttribute,\\n               bonus: {'",
              "'              target,\\n              attribute,\\n              scopeAttribute: scopeAttribute === \\\"all\\\" ? undefined : scopeAttribute,\\n              bonus: {'",
          )
          path.write_text(text)
          PY

      - name: Apply scoped attack and DC support
        run: python .github/apply_scoped_attack_dc.py

      - name: Remove temporary implementation files
        run: rm -f .github/scoped-attack-dc-trigger .github/apply_scoped_attack_dc.py

      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run build

      - name: Commit implementation to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add scoped attack and DC bonuses"
          git push origin HEAD:${{ github.head_ref }}
