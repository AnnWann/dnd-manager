name: Simplify class feature authoring

on:
  pull_request:
    branches:
      - feature/auth
    paths:
      - .github/workflows/simplify-class-feature-authoring.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature/auth
        uses: actions/checkout@v4
        with:
          ref: feature/auth
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Simplify progression feature definitions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, count))

          Path("src/data/classProgression/ability.ts").write_text('''import type { Ability, Usage } from "../../models/abilities/Ability"
import type { SpellGrant } from "../../models/magic/spells/SpellGrant"

export type ProgressionAbilityUsageConfig = Omit<
  Usage,
  "used" | "cooldownRemaining"
>

export type ProgressionSpellGrant = Omit<SpellGrant, "acquisition">

type RuntimeOwnedAbilityField =
  | "id"
  | "originalAbilityId"
  | "acquisition"
  | "usage"
  | "benefitsActive"
  | "modifiersActive"
  | "source"
  | "sourceItemId"
  | "sourceItemName"
  | "grantedSpells"

/**
 * Static class/subclass feature configuration.
 *
 * Identity, provenance and mutable state are character-owned and therefore
 * cannot be declared in progression data.
 */
export type ProgressionAbilityConfig = Partial<
  Omit<Ability, RuntimeOwnedAbilityField>
> & {
  usage?: ProgressionAbilityUsageConfig
  grantedSpells?: ProgressionSpellGrant[]
}

export type ApplyProgressionAbilityTemplateOptions = {
  /** Keep the projected name/description of choice-derived abilities. */
  preserveContent?: boolean
}

/** Declares a feature ability without widening literal values. */
export function defineProgressionAbility<
  const T extends ProgressionAbilityConfig,
>(configuration: T): T {
  return configuration
}

/** Creates a static usage definition; consumed uses remain character-owned. */
export function progressionUsage(
  max: number,
  reset: ProgressionAbilityUsageConfig["reset"],
  options: Partial<
    Omit<ProgressionAbilityUsageConfig, "max" | "reset">
  > = {},
): ProgressionAbilityUsageConfig {
  return { max, reset, ...options }
}

/** Creates a spell grant without runtime acquisition metadata. */
export function grantProgressionSpell(
  index: string,
  options: Omit<ProgressionSpellGrant, "index"> = {},
): ProgressionSpellGrant {
  return { index, ...options }
}

/**
 * Applies static progression data while preserving runtime identity and state.
 * This function is used both for newly materialized features and migrations.
 */
export function applyProgressionAbilityTemplate(
  ability: Ability,
  configuration: ProgressionAbilityConfig | undefined,
  options: ApplyProgressionAbilityTemplateOptions = {},
): Ability {
  if (!configuration) return ability

  const { usage: usageConfiguration, ...staticConfiguration } = configuration
  const hasUsageConfiguration = Object.prototype.hasOwnProperty.call(
    configuration,
    "usage",
  )
  const usage = hasUsageConfiguration
    ? usageConfiguration
      ? {
          ...usageConfiguration,
          used: clampUsedUses(
            ability.usage?.used ?? 0,
            usageConfiguration,
          ),
          cooldownRemaining: ability.usage?.cooldownRemaining,
        }
      : undefined
    : ability.usage
  const preserveContent = options.preserveContent === true

  return {
    ...ability,
    ...staticConfiguration,
    id: ability.id,
    name: preserveContent
      ? ability.name
      : staticConfiguration.name ?? ability.name,
    description: preserveContent
      ? ability.description
      : staticConfiguration.description ?? ability.description,
    usage,
    source: ability.source,
    sourceItemId: ability.sourceItemId,
    sourceItemName: ability.sourceItemName,
    originalAbilityId: ability.originalAbilityId,
    acquisition: ability.acquisition,
    benefitsActive: ability.benefitsActive,
    modifiersActive: ability.modifiersActive,
  }
}

function clampUsedUses(
  used: number,
  usage: ProgressionAbilityUsageConfig,
): number {
  const normalized = Math.max(0, Math.trunc(Number(used) || 0))
  if (usage.maxFormula?.trim()) return normalized
  return Math.min(Math.max(0, Math.trunc(Number(usage.max) || 0)), normalized)
}
''')

          Path("src/data/classProgression/types.ts").write_text('''import type { DieSides } from "../../models/dice/Die"
import type { ClassName, ClassSourceBook } from "../../models/sheet/Class"
import type { ProgressionAbilityConfig } from "./ability"

export type LevelChoiceKind =
  | "fighting-style"
  | "expertise"
  | "metamagic"
  | "pact-boon"
  | "invocation"
  | "maneuver"
  | "infusion"
  | "elemental-discipline"
  | "rune"
  | "subclass-option"
  | "asi"
  | "optional-feature"
  | "custom"

export type LevelChoiceDefinition = {
  id: string
  label: string
  kind: LevelChoiceKind
  count: number
  options?: string[]
  allowCustom?: boolean
  description?: string
}

export type LevelFeatureDefinition = {
  id: string
  name: string
  level: number
  source: ClassSourceBook
  optional?: boolean
  description?: string
  choice?: LevelChoiceDefinition
  ability?: ProgressionAbilityConfig
}

export type SubclassDefinition<
  TClassName extends ClassName = ClassName,
> = {
  id: string
  name: string
  className: TClassName
  source: ClassSourceBook
  features: LevelFeatureDefinition[]
}

export type ClassProgressionDefinition<
  TClassName extends ClassName = ClassName,
> = {
  className: TClassName
  label: string
  hitDie: DieSides
  source: ClassSourceBook
  subclassLevel: number
  features: LevelFeatureDefinition[]
  subclasses: SubclassDefinition<TClassName>[]
  cantripsKnown?: Partial<Record<number, number>>
}

export type ConfiguredLevelFeatureDefinition = LevelFeatureDefinition
export type SubclassProgressionModule<
  TClassName extends ClassName = ClassName,
> = SubclassDefinition<TClassName>
export type ClassProgressionModule<
  TClassName extends ClassName = ClassName,
> = ClassProgressionDefinition<TClassName>
''')

          Path("src/data/classProgression/applyProgressionAbilityConfig.ts").write_text('''import type { Ability } from "../../models/abilities/Ability"
import { createCharacterAcquisition } from "../../models/characters/CharacterAcquisition"
import type { ClassName } from "../../models/sheet/Class"
import {
  applyProgressionAbilityTemplate,
  type ProgressionAbilityConfig,
} from "./ability"
import { getClassProgression } from "./registry"
import type { LevelFeatureDefinition } from "./types"

const CLASS_NAMES: readonly ClassName[] = [
  "artificer",
  "barbarian",
  "bard",
  "cleric",
  "druid",
  "fighter",
  "monk",
  "paladin",
  "ranger",
  "rogue",
  "sorcerer",
  "warlock",
  "wizard",
]

/**
 * Refreshes content and mechanics from the canonical class/subclass feature.
 * Identity, acquisition and mutable state remain character-owned.
 */
export function applyProgressionAbilityConfig(ability: Ability): Ability {
  const feature = getProgressionFeatureDefinition(ability)
  if (!feature) return ability

  const isChoiceProjection = Boolean(
    ability.originalAbilityId && ability.originalAbilityId !== ability.id,
  )
  const sourcedAbility: Ability = {
    ...ability,
    name: isChoiceProjection ? ability.name : feature.name,
    description: isChoiceProjection
      ? ability.description
      : feature.description?.trim() || ability.description,
  }
  const configured = applyProgressionAbilityTemplate(
    sourcedAbility,
    feature.ability,
    { preserveContent: isChoiceProjection },
  )

  return withGrantedSpellAcquisition(configured)
}

export function getProgressionFeatureDefinition(
  ability: Ability,
): LevelFeatureDefinition | undefined {
  const sourceAbilityId = ability.originalAbilityId ?? ability.id
  const parsed = parseProgressionAbilityId(sourceAbilityId)
  if (!parsed) return undefined

  const progression = getClassProgression(parsed.className)
  return parsed.subclassId === "base"
    ? progression.features.find((entry) => entry.id === parsed.featureId)
    : progression.subclasses
        .find((entry) => entry.id === parsed.subclassId)
        ?.features.find((entry) => entry.id === parsed.featureId)
}

export function getProgressionAbilityConfig(
  ability: Ability,
): ProgressionAbilityConfig | undefined {
  return getProgressionFeatureDefinition(ability)?.ability
}

export function hasProgressionAbilityConfig(ability: Ability): boolean {
  return Boolean(getProgressionAbilityConfig(ability))
}

function withGrantedSpellAcquisition(ability: Ability): Ability {
  if (!ability.grantedSpells?.length || !ability.acquisition) return ability

  return {
    ...ability,
    grantedSpells: ability.grantedSpells.map((grant) => ({
      ...grant,
      acquisition:
        grant.acquisition ??
        createCharacterAcquisition({
          ...ability.acquisition!,
          sourceType: "ability",
          sourceId: ability.id,
          sourceName: ability.name,
        }),
    })),
  }
}

function parseProgressionAbilityId(value: string): {
  className: ClassName
  subclassId: string
  featureId: string
} | undefined {
  const [prefix, rawClassName, subclassId, ...featureParts] = value.split(":")
  if (
    prefix !== "progression" ||
    !isClassName(rawClassName) ||
    !subclassId ||
    !featureParts.length
  ) {
    return undefined
  }

  return {
    className: rawClassName,
    subclassId,
    featureId: featureParts.join(":"),
  }
}

function isClassName(value: string): value is ClassName {
  return CLASS_NAMES.includes(value as ClassName)
}
''')

          Path("src/data/classProgression/migration.ts").write_text('''import type { CharacterTemplate } from "../../models/characters/CharacterTemplate"
import { refreshProgressionAbilityDefinitions } from "../../models/leveling/refreshProgressionFeatureMechanics"

/** Increment whenever canonical feature content or mechanics require resync. */
export const CLASS_PROGRESSION_DATA_VERSION = 1

export function migrateCharacterProgressionData(
  character: CharacterTemplate,
): CharacterTemplate {
  const currentVersion = character.get("classProgressionVersion") ?? 0
  if (currentVersion >= CLASS_PROGRESSION_DATA_VERSION) return character

  return refreshProgressionAbilityDefinitions(character).with(
    "classProgressionVersion",
    CLASS_PROGRESSION_DATA_VERSION,
  )
}
''')

